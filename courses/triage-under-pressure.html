:root{
  --primary:#ffffff; --secondary:#f1f5f9; --cardBg:#e2e8f0; --glass:rgba(255,255,255,.74);
  --surface-hover:rgba(15,23,42,.04); --surface-hover-strong:rgba(15,23,42,.08);
  --text:#0f172a; --muted:#475569; --on-accent:#ffffff;
  --accent:#0e7490; --accentHover:#155e75; --accent-tint:rgba(14,116,144,.1); --accent-line:rgba(14,116,144,.32);
  --mint:#047857; --mint-tint:rgba(4,120,87,.1); --coral:#be123c; --coral-tint:rgba(190,18,60,.08);
  --line:rgba(15,23,42,.12); --line-subtle:rgba(15,23,42,.08); --line-faint:rgba(15,23,42,.05); --line-strong:rgba(15,23,42,.28);
  --shadow-lift:0 16px 30px -10px rgba(15,23,42,.18); --shadow-accent-glow:0 10px 15px -3px rgba(14,116,144,.25),0 4px 6px -4px rgba(14,116,144,.25); --shadow-modal:0 25px 50px -12px rgba(15,23,42,.25);
  --ok:#15803d; --ok-tint:rgba(21,128,61,.09); --bad:#b91c1c; --bad-tint:rgba(185,28,28,.07); --warn:#b45309; --warn-tint:rgba(180,83,9,.09);
  --r-lg:8px; --r-xl:12px; --r-2xl:16px; --r-3xl:24px;
  --f-head:"Lato",system-ui,sans-serif; --f-body:"Inter",system-ui,sans-serif;
  --side:320px; --col:768px; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--primary);color:var(--text);font:400 17px/1.625 var(--f-body);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:700;color:var(--text);margin:0;line-height:1.2;letter-spacing:-.025em}
p{margin:0}
a{color:var(--accent)}a:hover{color:var(--accentHover)}
button{font:inherit;color:inherit;cursor:pointer}
::selection{background:var(--accent-tint)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.skip{position:absolute;left:12px;top:-60px;z-index:300;background:var(--text);color:#fff;padding:10px 16px;border-radius:var(--r-xl);font-weight:600;text-decoration:none}
.skip:focus{top:12px;color:#fff}
.eyebrow{font:600 14px/20px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.lbl{font:600 12px/16px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid var(--line-subtle);border-radius:var(--r-2xl)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px 32px;border-radius:9999px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font:600 16px/24px var(--f-body);text-decoration:none;transition:background .15s ease,box-shadow .2s ease,border-color .15s ease,color .15s ease}
.btn .i{width:16px;height:16px}
.btn:hover{background:var(--accentHover);border-color:var(--accentHover);color:var(--on-accent);box-shadow:var(--shadow-accent-glow)}
.btn:disabled{background:var(--secondary);border-color:var(--line);color:#64748b;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:var(--surface-hover);border-color:var(--line-strong);color:var(--text)}
.btn.ghost:hover{background:var(--surface-hover-strong);box-shadow:none}
.btn.sm{min-height:44px;padding:10px 22px;font-size:15px}
.btn.coral{background:var(--coral);border-color:var(--coral)}
.btn.coral:hover{background:#9f1239;border-color:#9f1239;box-shadow:0 10px 15px -3px rgba(190,18,60,.25)}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:var(--r-xl);border:0;background:transparent;color:inherit}
.icon-btn:hover{background:var(--surface-hover-strong)}
.tile{flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:var(--r-lg);background:var(--accent-tint);color:var(--accent)}
.tile.mint{background:var(--mint-tint);color:var(--mint)} .tile.coral{background:var(--coral-tint);color:var(--coral)}

/* ---------- brand ---------- */
.mono{display:inline-flex;align-items:center;gap:12px;text-decoration:none}
.mono-ring{flex:none;width:40px;height:40px;border-radius:var(--r-xl);padding:2px;background:linear-gradient(to top right,var(--accent),var(--mint))}
.mono-ring img{display:block;width:100%;height:100%;border-radius:10px;background:#000}
.mono-txt{display:flex;flex-direction:column}
.mono-name{font:900 18px/24px var(--f-head);letter-spacing:-.025em;color:var(--text)}
.mono-name b{color:var(--accent)}
.mono-sub{font:600 9px/12px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}

/* ---------- cover ---------- */
.cover{min-height:100%;background:var(--primary)}
.cover-hero{position:relative;background:radial-gradient(ellipse 70% 60% at 50% -10%,rgba(14,116,144,.15),rgba(255,255,255,0) 70%),var(--primary);border-bottom:1px solid var(--line-faint)}
.cover-top{max-width:1152px;margin:0 auto;padding:20px 24px 0;display:flex;justify-content:space-between;align-items:center;gap:16px}
.cover-in{max-width:1152px;margin:0 auto;padding:48px 24px 80px;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:9999px;font:500 13px/20px var(--f-body);color:var(--muted)}
.pill .pulse{width:8px;height:8px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(4,120,87,.5);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(4,120,87,.45)}70%{box-shadow:0 0 0 8px rgba(4,120,87,0)}100%{box-shadow:0 0 0 0 rgba(4,120,87,0)}}
.cover h1{margin:8px 0 20px;font:900 60px/1.1 var(--f-head);letter-spacing:-.025em;max-width:13ch}
.hi{background:linear-gradient(90deg,var(--accent),var(--mint),var(--coral));-webkit-background-clip:text;background-clip:text;color:transparent}
.cover-desc{font:400 20px/1.625 var(--f-body);color:var(--muted);max-width:40ch}
.cover-meta{display:flex;flex-wrap:wrap;gap:10px 24px;margin:24px 0 32px;font-size:15px;color:var(--muted)}
.cover-meta span{display:inline-flex;align-items:center;gap:8px}
.cover-meta .i{color:var(--accent);width:18px;height:18px}
.cover-cta{display:flex;flex-wrap:wrap;gap:16px}
.cover-body{max-width:1152px;margin:0 auto;padding:72px 24px 96px;display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:48px}
.cover-body h2{font:700 30px/36px var(--f-head);margin:6px 0 20px}
.lesson-list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.lesson-link{display:flex;align-items:center;gap:16px;width:100%;padding:16px 18px;text-align:left;font:600 17px/1.4 var(--f-body);color:var(--text);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease}
.lesson-link:hover:not(:disabled){transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--accent-line)}
.lesson-link:disabled{color:#64748b;cursor:not-allowed}
.lesson-link .ttl{flex:1}
.lesson-link .tm{font:400 14px var(--f-body);color:var(--muted);white-space:nowrap}
.cover-side{padding:28px;align-self:start}
.cover-side h2{font:700 18px/28px var(--f-head);margin:0 0 8px}
.cover-side p{font-size:15px;color:var(--muted)}
.cover-side ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:10px;font-size:14.5px;line-height:1.55;color:var(--muted)}
.cover-side li{padding-left:18px;position:relative}
.cover-side li::before{content:"";position:absolute;left:0;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.cover-side li:nth-child(3n+2)::before{background:var(--mint)} .cover-side li:nth-child(3n)::before{background:var(--coral)}
.cover-side strong{color:var(--text)}
.cover-side hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.disclaimer{max-width:1152px;margin:0 auto;padding:0 24px 56px;font-size:13px;line-height:1.6;color:var(--muted)}
.disclaimer p{border-top:1px solid var(--line);padding-top:20px;max-width:90ch}
/* cover art: CAD console mock */
.art{border-radius:var(--r-3xl);padding:10px;background:var(--glass);border:1px solid var(--line-subtle);box-shadow:var(--shadow-lift)}
.art .cad{border-radius:18px}

/* ---------- status dots ---------- */
.dot{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;background:#fff}
.dot.part{border-color:var(--accent);background:conic-gradient(var(--accent) 0 50%,#fff 0)}
.dot.done{border-color:var(--ok);background:var(--ok);color:#fff}
.dot.done .i{width:14px;height:14px;stroke-width:3}
.dot.lock{border-style:dashed}

/* ---------- shell ---------- */
.shell{display:flex;height:100%}
.side{width:var(--side);flex:none;border-right:1px solid var(--line);background:var(--secondary);display:flex;flex-direction:column;height:100%;transition:margin-left .25s ease}
.shell.closed .side{margin-left:calc(-1 * var(--side))}
.side-top{padding:20px 22px 18px;border-bottom:1px solid var(--line)}
.side-brand{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.side-title{font:700 18px/28px var(--f-head);color:var(--text)}
.prog{margin-top:12px}
.prog-txt{font:600 12px/16px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--cardBg);overflow:hidden;margin-top:8px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s}
.side-nav{flex:1;overflow-y:auto;padding:8px 0}
.side-nav ol{list-style:none;margin:0;padding:0}
.side-nav button{display:flex;align-items:center;gap:12px;width:100%;padding:14px 22px;border:0;background:none;text-align:left;font:500 15.5px/1.35 var(--f-body);color:var(--text)}
.side-nav button:hover:not(:disabled){background:var(--surface-hover-strong)}
.side-nav button[aria-current="page"]{background:var(--accent-tint);font-weight:700;box-shadow:inset 4px 0 0 var(--accent)}
.side-nav button:disabled{color:#64748b;cursor:not-allowed}
.side-foot{border-top:1px solid var(--line);padding:12px 22px;display:flex;flex-direction:column;gap:4px}
.side-foot button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:8px 0;font:600 14.5px var(--f-body);color:var(--accent);text-align:left}
.side-foot button:hover{color:var(--accentHover)}
.side-close{display:none}
.main{flex:1;min-width:0;height:100%;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.8);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);min-height:60px}
.topbar .where{font:500 14px var(--f-body);color:var(--muted);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth}
.scrim{display:none}

/* ---------- lesson ---------- */
.lesson-head{max-width:var(--col);margin:0 auto;padding:72px 24px 8px;text-align:center}
.lesson-head h1{font:900 clamp(2.1rem,4.6vw,3rem)/1.12 var(--f-head);letter-spacing:-.025em;margin:10px 0 20px;outline:none}
.lesson-head .rule{width:56px;height:4px;border-radius:99px;background:var(--accent);margin:0 auto}
.blocks{padding:24px 0 0}
.blk{max-width:var(--col);margin:0 auto;padding:28px 24px}
.blk.wide{max-width:1152px}
.blk h2{font:700 clamp(1.5rem,2.8vw,1.9rem)/1.2 var(--f-head);margin-bottom:14px}
.blk h3{font:700 18px/28px var(--f-head)}
.blk p+p{margin-top:14px}
.blk ul,.blk ol{padding-left:24px;margin:12px 0 0}
.blk li+li{margin-top:6px}
.intro{color:var(--muted);margin:-4px 0 18px}
.seg-new{animation:fadein .5s ease}
@keyframes fadein{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.prose p{color:var(--text)}

.statement{text-align:center;padding:36px 8px;border-top:3px solid var(--accent);border-bottom:3px solid var(--accent);font:900 clamp(1.6rem,3.4vw,2.25rem)/1.25 var(--f-head);letter-spacing:-.025em;color:var(--text)}
.statement strong{color:var(--coral)}
.note{display:flex;gap:16px;padding:22px 24px}
.note .tile{margin-top:-2px}
.note strong:first-child{display:block;font:700 18px/28px var(--f-head);color:var(--text)}
.note p{color:var(--muted)}
.list-chk{list-style:none;padding:0!important;display:grid;gap:12px}
.list-chk li{display:flex;gap:14px;align-items:center;margin:0!important}
.list-chk li:nth-child(3n+2) .tile{background:var(--mint-tint);color:var(--mint)}
.list-chk li:nth-child(3n) .tile{background:var(--coral-tint);color:var(--coral)}
.list-chk .tile{width:36px;height:36px}

/* accordion */
.acc{display:grid;gap:10px}
.acc-item{overflow:hidden}
.acc-q{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;padding:18px 20px;border:0;background:none;text-align:left;font:700 18px/1.35 var(--f-head);color:var(--text)}
.acc-q .pm{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--accent-line);color:var(--accent);display:grid;place-items:center;background:var(--accent-tint)}
.acc-q[aria-expanded="true"] .pm{background:var(--accent);border-color:var(--accent);color:#fff}
.acc-a{padding:0 20px 20px;color:var(--muted)}

/* process */
.process{overflow:hidden}
.pr-card{padding:36px 40px;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.pr-card.intro-c{background:linear-gradient(135deg,rgba(14,116,144,.08),rgba(4,120,87,.06))}
.pr-card h3{font:700 24px/1.25 var(--f-head)}
.pr-card p{color:var(--muted)}
.pr-step{font:600 12px/16px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.pr-say{display:flex;gap:12px;align-items:flex-start;margin-top:8px;padding:14px 16px;border-radius:var(--r-xl);background:var(--accent-tint);border:1px solid var(--accent-line);color:var(--text);font-weight:500}
.pr-say .i{color:var(--accent);margin-top:3px}
.pr-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px;border-top:1px solid var(--line);background:var(--surface-hover)}
.pr-dots{display:flex;gap:6px;flex-wrap:wrap}
.pr-dots span{width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.pr-dots span.on{background:var(--accent);width:22px;border-radius:99px}

/* flashcards */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.blk ul.fields,.blk ol.path,.blk ul.list-chk{padding-left:0;margin-left:0}
.blk ul.fields{margin:0}
.card{min-height:230px;padding:24px;display:flex;flex-direction:column;justify-content:flex-start;text-align:left;font:inherit;color:inherit;transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift);border-color:var(--accent-line)}
.card .side-lbl{font:600 12px/16px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--accent);margin:14px 0 8px}
.card .front-t{font:700 20px/1.3 var(--f-head);color:var(--text)}
.card .back-t{font:400 15.5px/1.55 var(--f-body);color:var(--text)}
.card .hint{margin-top:auto;padding-top:16px;display:flex;align-items:center;gap:6px;font:500 13px var(--f-body);color:var(--muted)}
.card .hint .i{width:16px;height:16px}
.cards .card:nth-child(3n+2) .side-lbl{color:var(--mint)} .cards .card:nth-child(3n) .side-lbl{color:var(--coral)}
.card[aria-pressed="true"]{background:var(--secondary)}

/* sorting */
.sort-deck{display:flex;flex-direction:column;align-items:center;gap:12px;padding:24px}
.sort-card{width:min(440px,100%);padding:22px;border-radius:var(--r-2xl);background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-lift);text-align:center;font:700 19px/1.35 var(--f-head);color:var(--text)}
.sort-count{font:500 14px var(--f-body);color:var(--muted)}
.piles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:16px}
.pile{border:1.5px dashed var(--line-strong);border-radius:var(--r-2xl);padding:16px;min-height:130px;display:flex;flex-direction:column;gap:10px}
.pile h3{font:700 16px/1.3 var(--f-head);display:flex;align-items:center;gap:8px}
.pile h3::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--coral);flex:none}
.pile:nth-child(2) h3::before{background:var(--accent)} .pile:nth-child(3) h3::before{background:var(--mint)}
.pile .btn{width:100%}
.pile ul{list-style:none;padding:0;margin:0;font-size:14.5px;line-height:1.45}
.pile li{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);margin:0}
.pile li .i{color:var(--ok);width:16px;height:16px;margin-top:2px}
.sort-fb{min-height:1.6em;font-weight:600;margin-top:14px}
.sort-fb.no{color:var(--bad)}.sort-fb.ok{color:var(--ok)}

/* knowledge checks */
.kc{padding:32px}
.kc .q{font:700 22px/1.35 var(--f-head);color:var(--text);margin:8px 0 18px}
.kc fieldset{border:0;margin:0;padding:0;min-width:0}
.opt{display:flex;align-items:flex-start;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--r-xl);margin-top:10px;cursor:pointer;background:#fff;transition:border-color .15s}
.opt:hover{border-color:var(--accent)}
.opt input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-tint)}
.opt.wrong{border-color:var(--bad);background:var(--bad-tint)}
.opt .mark{margin-left:auto;font:600 13px var(--f-body);white-space:nowrap}
.opt.right .mark{color:var(--ok)}.opt.wrong .mark{color:var(--bad)}
.kc-actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:22px}
.kc-fb{margin-top:20px;padding:18px 20px;border-radius:var(--r-xl);display:flex;gap:14px}
.kc-fb.ok{background:var(--ok-tint)}.kc-fb.no{background:var(--bad-tint)}
.kc-fb .ic{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff}
.kc-fb.ok .ic{background:var(--ok)}.kc-fb.no .ic{background:var(--bad)}
.kc-fb .ic .i{width:18px;height:18px;stroke-width:2.5}
.kc-fb .verdict{display:block;color:var(--text)}

/* rating (Kirkpatrick L1) */
.rate{padding:28px 32px;display:grid;gap:22px}
.rate fieldset{border:0;margin:0;padding:0;min-width:0}
.rate legend{font:700 18px/1.35 var(--f-head);color:var(--text);margin-bottom:12px;padding:0}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale label{position:relative}
.scale input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.scale span{display:grid;place-items:center;min-height:48px;border:1px solid var(--line);border-radius:var(--r-xl);font:600 17px var(--f-body);background:#fff;transition:all .15s}
.scale input:hover+span{border-color:var(--accent)}
.scale input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.scale input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.scale-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:6px}
.rate-done{display:flex;gap:14px;align-items:center}

/* buttons stack (downloads) */
.btnstack{display:grid;gap:12px}
.btnrow{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;padding:20px 22px}
.btnrow .who{display:flex;gap:14px;align-items:center}
.btnrow p{font-size:15px;color:var(--muted)}
.btnrow strong{display:block;font:700 18px/28px var(--f-head);color:var(--text)}

/* sim results */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.stat{padding:24px 24px 22px;display:flex;flex-direction:column;gap:10px}
.stat .num{font:900 40px/1 var(--f-head);letter-spacing:-.025em;color:var(--text)}
.stat .cap{font-size:14.5px;color:var(--muted);line-height:1.5}
.stat .kick{font:600 12px/16px var(--f-body);letter-spacing:.05em;text-transform:uppercase;color:var(--accent)}
.stat:nth-child(2) .kick{color:var(--mint)} .stat:nth-child(3) .kick{color:var(--coral)}
.path{list-style:none;margin:20px 0 0;padding:0;display:grid;gap:8px}
.path li{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border:1px solid var(--line);border-radius:var(--r-xl);font-size:15px;background:#fff}
.path li .i{width:18px;height:18px;margin-top:3px}
.path .g{color:var(--ok)} .path .o{color:var(--warn)} .path .b{color:var(--bad)}
.empty{padding:24px;color:var(--muted);display:flex;gap:14px;align-items:center}

/* continue + lesson end */
.cont{max-width:var(--col);margin:0 auto;padding:24px 24px 36px;display:flex;flex-direction:column;align-items:center;gap:10px}
.cont .btn{min-width:260px}
.cont .need{font-size:14.5px;color:var(--muted);display:flex;align-items:center;gap:8px}
.cont .need .i{width:16px;height:16px}
.lesson-end{max-width:var(--col);margin:24px auto 0;padding:40px 24px 96px;text-align:center;border-top:1px solid var(--line)}
.lesson-end .done{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--f-body);color:var(--ok);margin-bottom:18px}
.lesson-end .btn{min-width:min(420px,100%)}
.lesson-end .nxt{display:block;margin-bottom:10px}

/* quiz */
.quiz{max-width:var(--col);margin:0 auto;padding:40px 24px 96px}
.quiz-intro{text-align:center;padding:44px 32px}
.quiz-intro p{color:var(--muted);margin:8px 0 24px}
.quiz-prog{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.result{text-align:center;padding:40px 30px}
.ring{--p:0;width:150px;height:150px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--cardBg) 0)}
.ring span{display:grid;place-items:center;width:120px;height:120px;border-radius:50%;background:#fff;font:900 34px var(--f-head);color:var(--text)}
.result .verdict{font:900 30px/1.2 var(--f-head)}
.result.pass .verdict{color:var(--ok)}.result.fail .verdict{color:var(--bad)}
.result .sent{display:inline-flex;align-items:center;gap:8px;margin-top:10px;color:var(--muted);font-size:15px}
.review{list-style:none;padding:0;margin:26px 0 0;text-align:left}
.review li{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);margin:0;font-size:15.5px}
.review .ok{color:var(--ok)}.review .no{color:var(--bad)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:400;background:var(--text);color:#fff;padding:12px 18px;border-radius:var(--r-xl);font-weight:600;box-shadow:var(--shadow-modal)}

/* dialog */
.dlg-wrap{position:fixed;inset:0;z-index:300;background:rgba(15,23,42,.45);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}
.dlg{width:min(600px,100%);max-height:88vh;overflow:auto;background:#fff;border-radius:var(--r-3xl);padding:24px 26px;box-shadow:var(--shadow-modal)}
.dlg-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dlg-top h2{font:700 24px/1.2 var(--f-head)}
.dlg dl{margin:0}.dlg dt{margin-top:14px}.dlg dd{margin:6px 0 0;color:var(--muted);font-size:15px}

/* =================== CAD live-call simulation (SS Dark tokens, scoped) =================== */
.cad{--bg:#151b23;--card:#1c2430;--tx:#f8fafc;--mu:#94a3b8;--ac:#22d3ee;--mi:#34d399;--co:#fb7185;--am:#fbbf24;--ln:rgba(255,255,255,.1);--ln2:rgba(255,255,255,.06);
  background:var(--bg);color:var(--tx);border-radius:var(--r-2xl);overflow:hidden;border:1px solid #0b1016;font-size:16px;position:relative}
.cad :focus-visible{outline-color:var(--ac)}
.cad-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 16px;background:#0f141b;border-bottom:1px solid var(--ln)}
.cad-live{display:inline-flex;align-items:center;gap:8px;font:700 12px/16px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.cad-live i{width:9px;height:9px;border-radius:50%;background:#475569}
.cad.on .cad-live{color:var(--co)} .cad.on .cad-live i{background:var(--co);animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}
.cad-inc{font:500 13px/18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mu);flex:1;min-width:140px}
.cad-clock{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1}
.cad-clock .lb{font:600 10px/12px var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.cad-clock .v{font:700 24px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--tx);font-variant-numeric:tabular-nums}
.cad-clock.over .v{color:var(--co)}
.cad-tg{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:9999px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.05);color:var(--tx);font:600 13px var(--f-body)}
.cad-tg:hover{background:rgba(255,255,255,.1)}
.cad-tg .i{width:16px;height:16px}
.cad-tg[aria-pressed="false"]{color:var(--mu)}
.cad-body{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(260px,1fr)}
.cad-left{padding:22px;border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:18px;min-width:0}
.cad-right{padding:18px 18px 20px;background:#18202a;min-width:0}
.caller{display:flex;gap:16px;align-items:flex-start}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 16px var(--f-head);color:#0b1016;background:linear-gradient(135deg,var(--ac),var(--mi));position:relative}
.cad.speaking .avatar::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--ac);animation:ring 1.1s ease-out infinite}
@keyframes ring{from{opacity:.9;transform:scale(.92)}to{opacity:0;transform:scale(1.25)}}
.caller-main{flex:1;min-width:0}
.caller-name{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font:600 12px/16px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.caller-name b{color:var(--ac);letter-spacing:.06em}
.wave{display:inline-flex;gap:3px;align-items:center;height:16px}
.wave s{display:block;width:3px;height:4px;border-radius:2px;background:var(--ac);opacity:.35}
.cad.speaking .wave s{opacity:1;animation:wv .7s ease-in-out infinite}
.wave s:nth-child(2){animation-delay:.1s!important}.wave s:nth-child(3){animation-delay:.2s!important}.wave s:nth-child(4){animation-delay:.3s!important}.wave s:nth-child(5){animation-delay:.15s!important}
@keyframes wv{0%,100%{height:4px}50%{height:16px}}
.caption{margin-top:6px;font:500 21px/1.45 var(--f-body);color:var(--tx);min-height:2.9em}
.caption.dim{color:var(--mu);font-size:17px}
.decide{border-top:1px solid var(--ln);padding-top:18px;display:grid;gap:10px}
.decide-h{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.decide-h p{font:700 18px/1.35 var(--f-head);color:var(--tx);outline:none}
.tmr{display:flex;align-items:center;gap:10px;font:600 13px var(--f-body);color:var(--mu);min-width:150px}
.tmr .tb{flex:1;height:6px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;min-width:80px}
.tmr .tb i{display:block;height:100%;width:100%;background:var(--ac);border-radius:inherit;transition:width 1s linear,background .3s}
.tmr.low .tb i{background:var(--co)} .tmr.low{color:var(--co)}
.ch{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:14px 16px;border-radius:var(--r-xl);border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--tx);font:500 16px/1.5 var(--f-body);transition:border-color .15s,background .15s}
.ch:hover:not(:disabled){border-color:var(--ac);background:rgba(34,211,238,.08)}
.ch .k{flex:none;display:grid;place-items:center;width:26px;height:26px;border-radius:8px;background:rgba(255,255,255,.08);font:700 13px var(--f-body);color:var(--mu);margin-top:1px}
.ch:disabled{opacity:.45;cursor:not-allowed;text-decoration:line-through}
.ch.p1 .k{background:rgba(251,113,133,.18);color:var(--co)}
.fbk{padding:16px 18px;border-radius:var(--r-xl);border:1px solid var(--ln);background:var(--card);display:grid;gap:6px}
.fbk .v{display:flex;align-items:center;gap:8px;font:700 17px/1.3 var(--f-head);outline:none}
.fbk.good .v{color:var(--mi)} .fbk.ok .v{color:var(--am)} .fbk.bad .v{color:var(--co)}
.fbk p{color:#cbd5e1;font-size:15.5px}
.fbk .pen{font:600 13px var(--f-body);color:var(--mu)}
.fbk .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.cad .btn{background:var(--ac);border-color:var(--ac);color:#000}
.cad .btn:hover{background:#06b6d4;border-color:#06b6d4;box-shadow:0 10px 15px -3px rgba(34,211,238,.2),0 4px 6px -4px rgba(34,211,238,.2)}
.cad .btn.ghost{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.2);color:var(--tx)}
.cad .btn.ghost:hover{background:rgba(255,255,255,.1);box-shadow:none}
.cad .btn.answer{background:var(--mi);border-color:var(--mi);color:#000}
.fields-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.fields-h h3{font:700 15px/20px var(--f-head);color:var(--tx);letter-spacing:0}
.fields-h span{font:500 12px var(--f-body);color:var(--mu)}
.fields{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.fld{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;border:1px dashed rgba(255,255,255,.14);background:rgba(255,255,255,.02)}
.fld .i{width:18px;height:18px;color:var(--mu);margin-top:2px}
.fld .fk{font:600 11px/14px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--mu)}
.fld .fv{font:500 14.5px/1.4 var(--f-body);color:var(--mu)}
.fld.part{border-style:solid;border-color:rgba(251,191,36,.45);background:rgba(251,191,36,.06)} .fld.part .i,.fld.part .fv{color:#fde68a}
.fld.done{border-style:solid;border-color:rgba(52,211,153,.4);background:rgba(52,211,153,.07)} .fld.done .i{color:var(--mi)} .fld.done .fv{color:var(--tx)}
.fld.pri.done{border-color:rgba(251,113,133,.55);background:rgba(251,113,133,.12)} .fld.pri.done .i,.fld.pri.done .fv{color:#fecdd3;font-weight:700}
.fld.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 rgba(34,211,238,.6)}100%{box-shadow:0 0 0 10px rgba(34,211,238,0)}}
.crew{margin-top:12px;padding:10px 12px;border-radius:10px;background:#0f141b;font:500 13px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--mu)}
.crew.go{color:var(--mi)}
.target{margin-top:10px;font-size:13px;color:var(--mu);display:flex;gap:8px;align-items:center}
.target .i{width:16px;height:16px}
.cad-foot{border-top:1px solid var(--ln);padding:10px 16px;background:#0f141b;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.cad-foot .note2{font-size:13px;color:var(--mu)}
.tx-log{max-height:240px;overflow:auto;padding:14px 16px;border-top:1px solid var(--ln);background:#0f141b;font-size:15px;display:grid;gap:8px}
.tx-log p b{color:var(--ac);font-weight:600}
.tx-log p.me b{color:var(--mi)}
.ring-card{display:grid;gap:16px;justify-items:start}
.ring-card h3{font:900 28px/1.15 var(--f-head);color:var(--tx);letter-spacing:-.025em;outline:none}
.ring-card p{color:#cbd5e1}
.ring-ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:rgba(52,211,153,.14);color:var(--mi);animation:shake 1.4s ease-in-out infinite}
.ring-ic .i{width:30px;height:30px}
@keyframes shake{0%,40%,100%{transform:rotate(0)}5%,15%,25%{transform:rotate(-12deg)}10%,20%,30%{transform:rotate(12deg)}}
.prefs{display:flex;gap:10px;flex-wrap:wrap}
.endbox{display:grid;gap:14px}
.endbox h3{font:900 26px/1.15 var(--f-head);color:var(--tx);outline:none}
.mini{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mini div{padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--ln)}
.mini b{display:block;font:900 26px/1.1 var(--f-head);color:var(--tx)}
.mini span{font-size:12.5px;color:var(--mu)}
.mini div:nth-child(1) b{color:var(--ac)} .mini div:nth-child(2) b{color:var(--mi)} .mini div:nth-child(3) b{color:var(--co)}

/* responsive */
@media (max-width:980px){
  .cover-in{grid-template-columns:1fr;gap:40px}
  .cover-body{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;z-index:60;box-shadow:0 0 40px rgba(15,23,42,.25);margin-left:0!important;transform:translateX(0);transition:transform .25s}
  .shell.closed .side{transform:translateX(-105%);visibility:hidden}
  .shell:not(.closed) .scrim{display:block;position:fixed;inset:0;z-index:50;background:rgba(15,23,42,.4)}
  .side-close{display:inline-grid}
  .cad-body{grid-template-columns:1fr}
  .cad-left{border-right:0}
  .cad-right{border-top:1px solid var(--ln)}
  .fields{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:768px){
  .cover h1{font-size:40px}
  .cover-desc{font-size:18px}
  .cover-body h2{font-size:26px}
  .piles{grid-template-columns:1fr}
  .stats{grid-template-columns:1fr}
  .cards{grid-template-columns:1fr}
}
@media (max-width:640px){
  body{font-size:16px}
  .cover-top{padding:16px 16px 0}.cover-in{padding:32px 16px 56px}.cover-body{padding:48px 16px 72px}.disclaimer{padding:0 16px 40px}
  .blk{padding:22px 16px}.lesson-head{padding:44px 16px 4px}
  .kc,.rate{padding:22px 18px}.pr-card{padding:26px 20px}
  .cont .btn{min-width:0;width:100%}
  .cad-left{padding:16px}.cad-right{padding:16px}
  .fields{grid-template-columns:1fr}
  .caption{font-size:18px}
  .cad-top{gap:10px}
  .mini{grid-template-columns:1fr}
  .scale span{min-height:44px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.scroll{scroll-behavior:auto}}
@media print{.side,.topbar,.cont{display:none}.shell{display:block}.scroll{overflow:visible}}

</style>

      blocks: [
        { t: 'text', heading: 'Sixty seconds that decide the response', paras: [
          'On a time-critical call, the order of your first questions decides how fast help moves. Get it right and a crew is rolling while you’re still on the line. Get it wrong and the minutes go to the caller’s panic instead of the patient.',
          'This module takes about eight minutes. The live call in lesson 4 runs for about two.'
        ] },
        { t: 'note', tone: 'tip', title: 'Use headphones if you can', text: 'The live call plays the caller’s voice and line noise. Captions are always on, and you can turn the sound or the decision timer off at any time.' },

          correct: 1, fb: {

        { t: 'list', heading: 'In this module you’ll', style: 'check', items: [

        ] }

    {
      id: 'sixty', title: 'The first 60 seconds', min: 2, icon: 'timer',
      blocks: [
        { t: 'statement', text: 'Triage the **patient**, not the panic.' },
        { t: 'process', heading: 'The question sequence', lead: 'Work through the five steps. Each one shows what to say.',
          intro: { title: 'Five moves, in this order', text: 'Every step unlocks the next. Skipping ahead feels faster and almost always costs time.' },
          steps: [
            { title: 'Location', text: 'Get the address of the emergency and **read it back**. Unit numbers, cross streets and landmarks save minutes at the door.', say: 'What’s the address of the emergency?' },
            { title: 'Callback number', text: 'If the line drops, it’s your only way back to the caller.', say: 'What number are you calling from?' },
            { title: 'Exactly what happened', text: 'An open question gets the chief complaint fast. Listen for the key words, not the whole story.', say: 'Tell me exactly what happened.' },
            { title: 'The big two', text: '**Is the patient conscious? Are they breathing normally?** These two answers drive the priority.', say: 'Is he awake? Is his breathing normal, or is it more like gasping?' },
            { title: 'Code, then coach', text: 'Set the priority so the right crew moves, then give instructions: CPR, bleeding control or keeping everyone safe.', say: 'Help is on the way. I’m going to tell you exactly what to do.' }

        { t: 'continue', gate: true },
        { t: 'flashcards', heading: 'Pressure traps', intro: 'Callers rarely use clinical words. Flip each card to see what’s really being reported.', cards: [

          { front: '“She was fitting, but she’s stopped now.”', back: 'Stopping isn’t the same as safe. Re-check: is she responding, and is she **breathing normally** now?' },
          { front: '“It’s probably just indigestion.”', back: 'Callers play symptoms down. Chest pain with sweating, pallor or breathlessness is a **red flag**, whatever the caller calls it.' },

        h('div', { class: 'prog' }, h('div', { class: 'prog-txt' }, p + '% complete'), h('div', { class: 'bar', role: 'progressbar', 'aria-label': 'Module progress', 'aria-valuemin': 0, 'aria-valuemax': 100, 'aria-valuenow': p }, h('i', { style: 'width:' + p + '%' })))),
      h('div', { class: 'side-nav' }, h('ol', null, L.map((l, i) => h('li', null, h('button', { disabled: !available(i), 'aria-current': i === S.cur ? 'page' : null, onclick: () => open(i) }, statusDot(i), h('span', null, l.title, h('span', { class: 'sr' }, ' — ' + statusText(i)))))))),
      h('div', { class: 'side-foot' }, h('button', { onclick: () => { leave(); S.cur = -1; save(); render(true); } }, ic('home'), 'Module Overview'), h('button', { 'aria-haspopup': 'dialog', onclick: e => resources(e.currentTarget) }, ic('download'), 'Resources')));
  }

  function resources(from) {
    const close = () => { wrap.remove(); from && from.focus(); };
    const x = h('button', { class: 'icon-btn', 'aria-label': 'Close resources', onclick: close }, ic('x'));
    const wrap = h('div', { class: 'dlg-wrap', onclick: e => { if (e.target === wrap) close(); } }, h('div', { class: 'dlg', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'rh' },
      h('div', { class: 'dlg-top' }, h('h2', { id: 'rh' }, 'Resources'), x),
      h('dl', null, C.resources.map(r => [h('dt', null, h('button', { class: 'btn sm', onclick: e => saveFile(r, e.currentTarget) }, ic('download'), r.title)), h('dd', null, r.desc + ' · ' + r.meta)]))));
    wrap.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); return; }
      if (e.key === 'Tab') { const f = [...wrap.querySelectorAll('button,a')]; const first = f[0], last = f[f.length - 1]; if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); } else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); } }
    });
    document.body.append(wrap); x.focus();
  }

  /* lesson: blocks split into segments by Continue dividers */
  function segments(l) { const segs = [[]]; l.blocks.forEach((b, i) => { if (b.t === 'continue') segs.push([]); else segs[segs.length - 1].push(i); }); return segs; }
  const conts = l => l.blocks.filter(b => b.t === 'continue');
  const GATED = ['kc', 'process', 'flashcards', 'sort', 'sim'];
  let gateRefresh = null, leaveFns = [];
  function leave() { leaveFns.forEach(f => { try { f(); } catch (e) {} }); leaveFns = []; }
  function lessonView(i) {
    const l = L[i]; const segs = segments(l); const cs = conts(l);
    const shown = Math.min(S.seg[l.id] || 0, cs.length);
    const blocks = h('div', { class: 'blocks' });
    const ctxFor = bi => { const key = l.id + '_' + bi; const c = { key, done: () => !!S.bc[key], complete: () => { if (S.bc[key]) return; S.bc[key] = true; save(); gateRefresh && gateRefresh(); } }; return c; };
    const segEl = (k, isNew) => { const el = h('div', { class: 'seg' + (isNew ? ' seg-new' : ''), 'data-seg': k }); segs[k].forEach(bi => { const b = l.blocks[bi]; const fn = B[b.t]; const cx = ctxFor(bi); const node = fn ? fn(b, cx) : null; if (cx.onLeave) leaveFns.push(cx.onLeave); if (node) el.append(h('div', { class: 'blk' + (b.wide ? ' wide' : ''), 'data-t': b.t }, node)); }); return el; };
    for (let k = 0; k <= shown; k++) blocks.append(segEl(k, false));
    const tail = h('div');
    const drawTail = () => {
      const cur = Math.min(S.seg[l.id] || 0, cs.length);
      if (cur < cs.length) {
        const c = cs[cur]; const pending = () => segs[cur].filter(bi => GATED.includes(l.blocks[bi].t) && !S.bc[l.id + '_' + bi]).length;
        const need = c.gate ? pending() : 0;
        const btn = h('button', { class: 'btn', disabled: need > 0 || null, 'aria-describedby': need ? 'need' : null, onclick: () => {
          S.seg[l.id] = cur + 1; save(); const el = segEl(cur + 1, true); blocks.append(el); drawTail(); refreshSide();
          el.tabIndex = -1; el.focus({ preventScroll: true }); el.scrollIntoView({ behavior: reduce() ? 'auto' : 'smooth', block: 'start' }); say('More content added below.');
        } }, c.label || 'Continue');
        rc(tail, h('div', { class: 'cont' }, btn, need ? h('p', { class: 'need', id: 'need' }, ic('lock'), 'Complete the activity above to continue') : null));
        gateRefresh = () => { if (c.gate && pending() === 0 && btn.disabled) { btn.disabled = false; btn.removeAttribute('aria-describedby'); const nd = tail.querySelector('.need'); nd && nd.remove(); say('Continue is now available.'); } };
      } else {
        gateRefresh = null;
        const next = i + 1 < N ? i + 1 : -1;
        const end = h('div', { class: 'lesson-end' }, h('p', { class: 'done' }, ic('check'), 'Lesson complete'),
          next >= 0 ? [h('span', { class: 'nxt lbl', id: 'nxtl' }, 'Next'), h('button', { class: 'btn', 'aria-describedby': 'nxtl', onclick: () => { markDone(l); open(next); } }, L[next].title, ic('arrowR'))] : h('button', { class: 'btn', onclick: () => { markDone(l); leave(); S.cur = -1; save(); render(true); } }, 'Back to Module Overview'));
        rc(tail, end);
        if ('IntersectionObserver' in window) { const io = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) { markDone(l); io.disconnect(); } }); setTimeout(() => io.observe(end), 400); }
      }
    };
    drawTail();
    return h('div', null, h('header', { class: 'lesson-head' }, h('p', { class: 'eyebrow' }, 'Lesson ' + (i + 1) + ' of ' + (N - 1)), h('h1', { id: 'title', tabindex: '-1' }, l.title), h('div', { class: 'rule', 'aria-hidden': 'true' })), blocks, tail);
  }
  function markDone(l) { if (S.done[l.id]) return; S.done[l.id] = true; save(); refreshSide(); }

  /* quiz lesson */
  function quizView(i) {
    const l = L[i]; const wrap = h('div', { class: 'quiz' }); let q = 0, ans = [];
    const intro = () => {
      const last = S.quiz;
      rc(wrap, h('div', { class: 'quiz-intro glass' }, tile('cap'), h('h2', { style: 'margin-top:14px' }, l.title), h('p', null, l.questions.length + ' questions · Passing score ' + l.pass + '% · You can retake it'),
        last ? h('p', null, 'Your last result: ' + last.pct + '% (' + (last.passed ? 'passed' : 'not yet passed') + ')') : null,
        h('button', { class: 'btn', onclick: () => { q = 0; ans = []; question(true); } }, last ? 'Retake Check' : 'Start Check', ic('arrowR'))));
      wrap.querySelector('.tile').style.margin = '0 auto';
    };
    const question = (focus) => {
      const Q = l.questions[q]; const name = 'qz' + q;
      const fs = h('fieldset', { style: 'border:0;padding:0;margin:0' }, h('legend', { class: 'sr' }, Q.q),
        Q.options.map((o, k) => h('label', { class: 'opt' }, h('input', { type: Q.kind === 'mr' ? 'checkbox' : 'radio', name, value: k }), h('span', { html: inl(o) }))));
      const qh = h('p', { class: 'q', tabindex: '-1' }, Q.q);
      rc(wrap, h('div', { class: 'kc glass' }, h('div', { class: 'quiz-prog' }, h('span', { class: 'eyebrow' }, 'Question ' + (q + 1) + ' of ' + l.questions.length), h('span', { class: 'lbl' }, l.title)),
        h('div', { class: 'bar', 'aria-hidden': 'true' }, h('i', { style: 'width:' + (q / l.questions.length * 100) + '%' })), qh, fs,
        h('div', { class: 'kc-actions' }, h('button', { class: 'btn', onclick: () => {
          const pick = [...fs.querySelectorAll('input:checked')].map(x => +x.value); if (!pick.length) { toast('Choose an answer first'); return; }
          ans[q] = pick; q++; q < l.questions.length ? question(true) : result();
        } }, q < l.questions.length - 1 ? 'Next Question' : 'Submit Check', ic('arrowR')))));
      if (focus) qh.focus();
    };
    const correct = (Q, a) => Q.kind === 'mr' ? (a.length === Q.answer.length && a.every(x => Q.answer.includes(x))) : a[0] === Q.answer;
    const result = () => {
      const right = l.questions.filter((Q, k) => correct(Q, ans[k])).length; const pct = Math.round(right / l.questions.length * 100); const passed = pct >= l.pass;
      S.quiz = { pct, passed, right, total: l.questions.length }; if (passed) S.done[l.id] = true; save(); refreshSide();
      l.questions.forEach((Q, k) => LMS.interaction({ id: 'q' + (k + 1), type: 'choice', response: ans[k].map(x => 'abcdefgh'[x]).join(LMS_SEP()), correct: [].concat(Q.answer).map(x => 'abcdefgh'[x]).join(LMS_SEP()), ok: correct(Q, ans[k]), text: Q.q }));
      LMS.result(pct, l.pass);
      const vh = h('p', { class: 'verdict', tabindex: '-1' }, passed ? 'You passed' : 'Not quite yet');
      rc(wrap, h('div', { class: 'result glass ' + (passed ? 'pass' : 'fail'), role: 'status' },
        h('div', { class: 'ring', style: '--p:' + pct, 'aria-hidden': 'true' }, h('span', null, pct + '%')), h('span', { class: 'sr' }, 'Score ' + pct + ' per cent. '), vh,
        h('p', null, right + ' of ' + l.questions.length + ' correct. Passing score: ' + l.pass + '%.'),
        h('p', { class: 'sent' }, ic(LMS.ok ? 'check' : 'info'), LMS.ok ? 'Your result has been sent to your learning platform.' : 'Viewing outside a learning platform: your result is saved in this browser only.'),
        h('div', { class: 'kc-actions', style: 'justify-content:center' }, h('button', { class: passed ? 'btn ghost' : 'btn', onclick: () => { q = 0; ans = []; question(true); } }, ic('replay'), 'Retake Check'), passed ? h('button', { class: 'btn', onclick: () => { S.cur = -1; save(); render(true); } }, 'Finish') : null),
        h('ul', { class: 'review', 'aria-label': 'Review your answers' }, l.questions.map((Q, k) => { const g = correct(Q, ans[k]); return h('li', null, h('span', { class: g ? 'ok' : 'no' }, ic(g ? 'check' : 'x'), h('span', { class: 'sr' }, g ? 'Correct: ' : 'Incorrect: ')), h('span', null, h('strong', null, Q.q), ' ', g ? null : h('span', null, 'Answer: ' + [].concat(Q.answer).map(x => Q.options[x]).join('; ') + '. '), h('span', { html: inl(Q.why || '') }))); }))));
      vh.focus();
    };
    intro();
    return h('div', null, h('header', { class: 'lesson-head' }, h('p', { class: 'eyebrow' }, 'Final check'), h('h1', { id: 'title', tabindex: '-1' }, l.title), h('div', { class: 'rule', 'aria-hidden': 'true' })), wrap);
  }
  const LMS_SEP = () => LMS.is04 ? '[,]' : ',';

  function refreshSide() { const old = app.querySelector('.side'); if (old) { const sc = old.querySelector('.side-nav').scrollTop; const nu = sidebar(); old.replaceWith(nu); nu.querySelector('.side-nav').scrollTop = sc; setSide(sideOpen); } }
  const small = () => !matchMedia('(min-width: 981px)').matches;
  function setSide(v) {
    sideOpen = v; const sh = app.querySelector('.shell'); if (sh) sh.classList.toggle('closed', !v);
    const b = document.getElementById('menubtn'); if (b) b.setAttribute('aria-expanded', String(v));
    const main = app.querySelector('.main'); const side = app.querySelector('.side');
    if (main) main.inert = small() && v;
    if (side) { if (small()) { side.setAttribute('role', 'dialog'); side.setAttribute('aria-modal', String(v)); } else { side.removeAttribute('role'); side.removeAttribute('aria-modal'); } }
  }
  function open(i) { if (!available(i)) return; leave(); S.cur = i; save(); if (small()) sideOpen = false; render(true); }

  function render(focus) {
    rc(app);
    if (S.cur < 0) { app.append(h('a', { class: 'skip', href: '#main' }, 'Skip to main content'), cover()); document.title = C.title; if (focus) document.getElementById('title').focus(); return; }
    const l = L[S.cur];
    const body = l.type === 'quiz' ? quizView(S.cur) : lessonView(S.cur);
    const main = h('div', { class: 'main' },
      h('header', { class: 'topbar' }, h('button', { class: 'icon-btn', id: 'menubtn', 'aria-label': 'Module menu', 'aria-expanded': String(sideOpen), onclick: () => { setSide(!sideOpen); if (sideOpen && small()) { const c = app.querySelector('.side-close'); c && setTimeout(() => c.focus(), 30); } } }, ic('menu')),
        h('p', { class: 'where' }, C.title + ' · ' + l.title)),
      h('main', { class: 'scroll', id: 'main', tabindex: '-1' }, body));
    app.append(h('a', { class: 'skip', href: '#title', onclick: e => { e.preventDefault(); document.getElementById('title').focus(); } }, 'Skip to lesson content'),
      h('div', { class: 'shell' + (sideOpen ? '' : ' closed') }, sidebar(), h('div', { class: 'scrim', onclick: () => setSide(false) }), main));
    document.title = l.title + ' · ' + C.title;
    setSide(sideOpen);
    if (focus) { document.getElementById('main').scrollTop = 0; document.getElementById('title').focus({ preventScroll: true }); }
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && sideOpen && small() && !document.querySelector('.dlg')) { setSide(false); const b = document.getElementById('menubtn'); b && b.focus(); } });
  matchMedia('(min-width: 981px)').addEventListener('change', () => { if (S.cur >= 0) setSide(!small()); });
  window.__RISE__ = { S, L, open, render, save };
  render();
})();

</script>
