  --mint:#047857; --mint-tint:#e6f2ee; --mint-line:#b4d6cb;
  --coral:#be123c; --coral-tint:#f9e8ec; --coral-line:#ebb8c4;
  --line:#e1e3e7; --line-strong:#c9cdd2; --logo-cyan:#0cc0df; --logo-green:#7ed957;
  --shadow-lift:0 16px 30px -10px rgba(15,23,42,.15);
  /* dark panels reuse the Dark theme's values */
  --ink:#0b0f14; --ink-2:#151b23; --ink-3:#1c2430; --ink-line:rgba(255,255,255,.12); --ink-text:#f8fafc; --ink-muted:#cbd5e1; --ink-hi:#22d3ee; --ink-mint:#34d399; --ink-coral:#fb7185;
  /* engine aliases */
  --canvas:var(--primary); --surface:var(--white); --sunken:var(--secondary); --strong:var(--line-strong);
  --body:var(--text); --faint:var(--muted);
  --acc:var(--accent); --acc-ink:var(--accent); --on-acc:var(--on-accent); --acc-soft:var(--accent-tint);
  --ok:var(--mint); --ok-ink:var(--mint); --ok-soft:var(--mint-tint);
  --bad:var(--coral); --bad-soft:var(--coral-tint);
  --f-head:"Lato","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:320px; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--body);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:700;color:var(--text);margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
strong,b{color:var(--text);font-weight:700}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunken);border:1px solid var(--line);padding:.05em .35em;border-radius:6px;color:var(--accent)}
.eyebrow{display:inline-block;font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- App shell ---------- */
#app{height:100%;display:flex}
.side{width:var(--side);flex:none;background:var(--white);color:var(--text);display:flex;flex-direction:column;height:100%;position:relative;z-index:40;border-right:1px solid var(--line);transition:margin-left .28s ease,transform .28s ease}
#app.menu-closed .side{margin-left:calc(-1 * var(--side));visibility:hidden;transition:margin-left .28s ease,transform .28s ease,visibility 0s linear .28s}
.side-head{padding:22px 20px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.side-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:inherit}
.icon-btn:hover{background:var(--secondary)}
.side-title{font:700 20px/1.2 var(--f-head);color:var(--text)}
.series-chip{display:inline-flex;align-items:center;gap:6px;width:max-content;font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--on-accent);background:var(--accent);padding:6px 10px;border-radius:9999px}
.series-chip svg{width:14px;height:14px}
.side-prog{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:9999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s ease}
.side-link{display:inline-flex;align-items:center;gap:8px;color:var(--text);background:none;border:0;padding:4px 0;font-size:14px;width:max-content}
.side-link:hover{text-decoration:underline}
.toc{flex:1;overflow-y:auto;padding:8px 12px 16px}
.mod{padding:12px 4px 4px}
.mod-btn{width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;background:none;border:0;color:var(--text);text-align:left;padding:4px 4px 8px}
.mod-btn .k{display:block;margin-bottom:3px;font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.mod-btn .t{font:700 16px/1.25 var(--f-head)}
.mod-btn .c{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.mod-btn svg{transition:transform .2s}
.mod.closed .mod-btn svg{transform:rotate(-90deg)}
.mod.closed .scr-list{display:none}
.scr-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.scr{width:100%;display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;border:0;background:transparent;color:var(--muted);text-align:left;font-size:14.5px;line-height:1.35}
.scr:hover:not(:disabled){background:var(--secondary);color:var(--text)}
.scr:disabled{cursor:not-allowed}
.scr .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;background:var(--white)}
.scr.done .dot{background:var(--mint);border-color:var(--mint)}
.scr.done .dot svg{width:11px;height:11px;stroke:#fff;stroke-width:3}
.scr.cur{background:var(--accent-tint);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.scr.cur .dot{border-color:var(--accent);background:var(--accent)}
.scr .m{font-size:12px;color:var(--muted)}
.scr .m svg{width:14px;height:14px}
.side-foot{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;padding:8px;border-top:1px solid var(--line)}
.side-foot button{display:grid;justify-items:center;gap:4px;padding:10px 4px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:13px}
.side-foot button:hover,.side-foot button[aria-pressed="true"]{background:var(--secondary);color:var(--text)}
.side-note{padding:0 16px 12px;font-size:12px;color:var(--muted)}
.drawer{position:absolute;left:0;right:0;bottom:78px;max-height:60%;overflow:auto;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -12px 30px -12px rgba(15,23,42,.15);padding:18px 20px;display:grid;gap:12px}
.drawer h3{font-size:16px}
.drawer dl{margin:0;display:grid;gap:10px}
.drawer dt{font-weight:600;font-size:14px}
.drawer dt a{display:inline-flex;align-items:center;gap:6px;color:var(--accent)}
.drawer dd{margin:0;color:var(--muted);font-size:13.5px}
.drawer textarea{width:100%;min-height:140px;background:var(--white);border:1px solid var(--line-strong);border-radius:12px;padding:10px}
.scrim{display:none}
.side-logo,.logo{display:flex;align-items:center;gap:10px;font:900 16px/1.15 var(--f-head);color:var(--text)}
.side-logo img,.logo img{width:40px;height:40px;border-radius:12px;background:#000;object-fit:cover;flex:none}
.side-logo small,.logo small{display:block;font:500 12px var(--f-body);color:var(--muted);letter-spacing:0}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--white);color:var(--muted)}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:14.5px;white-space:nowrap;overflow:hidden}
.crumbs span{overflow:hidden;text-overflow:ellipsis}
.crumbs .now{color:var(--text);font-weight:500}
.crumbs svg{width:14px;height:14px}
.tb-meta{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.tb-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text);font-size:14px;white-space:nowrap}
.tb-btn:hover{background:var(--secondary)}
.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth;scroll-padding:24px 0 96px}
@media (prefers-reduced-motion:reduce){.scroll{scroll-behavior:auto}}
.page{max-width:920px;margin:0 auto;padding:44px 24px 72px}
.page.wide{max-width:1120px}
.page-head{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:32px}
.page-head .eyebrow{grid-column:1/-1}
#scrtitle:focus{outline:none}
.page-head h1{font-size:clamp(2rem,4.4vw,2.6rem);line-height:1.1;font-weight:900;letter-spacing:-.025em}
.page-head .meta{display:flex;gap:18px;color:var(--muted);font-size:13px;align-items:center;padding-bottom:8px}
.page-head .meta span{display:inline-flex;gap:6px;align-items:center}
.blocks{display:grid;gap:44px}
.footnav{border-top:1px solid var(--line);background:var(--white);padding:0 20px calc(12px + env(safe-area-inset-bottom,0px))}
.footnav .bar{background:var(--line);margin:0 -20px 12px;border-radius:0;height:3px}
.footnav-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:9999px;border:1px solid var(--line-strong);background:var(--white);color:var(--text);font-weight:600}
.nav-btn:disabled{opacity:.5;cursor:not-allowed}
.nav-btn.next{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.nav-btn.next:not(:disabled):hover{background:var(--accentHover);border-color:var(--accentHover)}
.foot-status{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;text-align:center}
.foot-status .sep{width:1px;height:14px;background:var(--line-strong)}
.foot-status .need{color:var(--accent);font-weight:600}

/* ---------- Cover ---------- */
.cover{flex:1;min-width:0;min-height:100%;display:grid;grid-template-rows:auto 1fr;background:var(--canvas)}
.cover-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px max(16px,4vw);border-bottom:1px solid var(--line);background:var(--white)}
.cover-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:start;max-width:1180px;width:100%;margin:0 auto;padding:48px max(16px,4vw) 64px}
.eyebrow-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cover-body h1{font-size:clamp(2.3rem,5vw,3.75rem);line-height:1.05;margin:16px 0 18px;letter-spacing:-.025em;font-weight:900}
.cover-body .lede{font-size:18px;line-height:1.6;max-width:56ch}
.cover-facts{display:flex;flex-wrap:wrap;gap:28px;margin:28px 0}
.cover-facts div{display:grid;gap:2px}
.cover-facts dt{font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.cover-facts dd{margin:0;font:700 19px var(--f-head);color:var(--text)}
.cover-cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.cover-note{margin-top:24px;font-size:13.5px;color:var(--muted);max-width:60ch}
.cover-side{display:grid;gap:16px}
.cover-art{display:flex;justify-content:center;align-items:flex-end;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:24px;padding:18px;min-height:220px}
.cover-art img{max-height:280px;max-width:100%;object-fit:contain}
.cover-art.many img{max-height:240px;max-width:32%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:9999px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;text-decoration:none}
.btn:hover{background:var(--accentHover);border-color:var(--accentHover)}
.btn.ghost{background:var(--white);color:var(--text);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--secondary);border-color:var(--text)}
.btn.sm{min-height:40px;padding:0 18px;font-size:14.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.on-dark{background:var(--ink-hi);border-color:var(--ink-hi);color:#000}
.btn.on-dark:hover{background:#06b6d4;border-color:#06b6d4}
.cover-path{display:grid;gap:10px}
.path-card{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:14px 16px;border-radius:16px;background:var(--white);border:1px solid var(--line);text-align:left;color:var(--text);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.path-card:not(:disabled):hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--accent-line)}
.path-card:disabled{cursor:not-allowed;opacity:.75}
.path-card .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:900 17px var(--f-head);color:var(--accent);background:var(--accent-tint)}
.path-card.done .n{background:var(--mint-tint);color:var(--mint)}
.path-card .k{display:block;font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.path-card .t{display:block;font:700 17px/1.3 var(--f-head);margin:2px 0}
.path-card .p{display:block;color:var(--muted);font-size:14px;line-height:1.5}

/* ---------- Blocks ---------- */
.blk{position:relative;min-width:0}
.blk-head{display:grid;gap:6px;margin-bottom:18px}
.blk-head h2{font-size:clamp(1.35rem,2.6vw,1.7rem);line-height:1.2}
.blk-head p{color:var(--muted)}
.req{display:inline-flex;align-items:center;gap:6px;width:max-content;font:600 12px/16px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-tint);border:1px solid var(--accent-line);padding:4px 10px;border-radius:9999px}
.req.ok{color:var(--mint);background:var(--mint-tint);border-color:var(--mint-line)}
.req svg{width:13px;height:13px}
.prose{display:grid;gap:14px;max-width:70ch}
.prose ul,.prose ol{margin:0;padding-left:1.25em;display:grid;gap:6px}
.prose h2{font-size:clamp(1.35rem,2.6vw,1.7rem);line-height:1.2}
.prose a{color:var(--accent)}
.lead{font-size:clamp(1.12rem,2vw,1.3rem);line-height:1.6;color:var(--text);max-width:62ch}
.quote{margin:0;border-left:0;padding:20px 24px;border-radius:16px;background:var(--white);border:1px solid var(--line);font:700 1.2rem/1.45 var(--f-head);color:var(--text);display:grid;gap:8px}
.quote.sm{font-size:1.02rem;padding:16px 18px}
.quote small{font:400 14px var(--f-body);color:var(--muted)}

.hero{position:relative;overflow:hidden;border-radius:24px;background:var(--white);border:1px solid var(--line);padding:clamp(26px,5vw,44px);display:grid;gap:24px;grid-template-columns:1fr}
.hero.has-img{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:center}
.hero-t{display:grid;gap:16px}
.hero h2{font-size:clamp(1.9rem,4.4vw,2.8rem);line-height:1.08;font-weight:900;letter-spacing:-.025em;max-width:18ch}
.hero p{font-size:18px;max-width:56ch}
.hero dl{display:flex;flex-wrap:wrap;gap:28px;margin:4px 0 0}
.hero dt{font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hero dd{margin:0;font:900 24px var(--f-head);color:var(--text)}
.hero-img{display:grid;place-items:center}
.hero-img img{max-width:100%;max-height:300px;object-fit:contain}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-s,.chips .chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:9999px;background:var(--secondary);border:1px solid var(--line);font-size:13px;color:var(--text)}

.ph{position:relative;display:grid;place-items:center;text-align:center;aspect-ratio:16/10;max-width:100%;border-radius:16px;border:1px dashed var(--line-strong);color:var(--muted);font-size:14px;padding:20px;background:repeating-linear-gradient(45deg,var(--secondary) 0 10px,var(--white) 10px 20px)}
.ph svg{width:28px;height:28px;margin:0 auto 8px}
.ti{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center}
.ti.right>figure,.ti.right>.ph{order:2}
.ti .prose h2{font-size:1.5rem}
.pic{margin:0;display:grid;gap:8px}
.pic img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);background:var(--white)}
.pic.contain img{max-height:360px;object-fit:contain;padding:12px}
.pic.svg>div{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--white)}
.pic.svg svg{display:block;width:100%;height:auto}
.pic figcaption{font-size:13.5px;color:var(--muted)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.icard{padding:22px;border-radius:16px;background:var(--white);border:1px solid var(--line);display:grid;gap:8px;align-content:start}
.icard .ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.icard.fam-mint .ico{background:var(--mint-tint);color:var(--mint)}
.icard.fam-coral .ico{background:var(--coral-tint);color:var(--coral)}
.icard h3{font-size:17px}
.icard p{font-size:15px;color:var(--muted)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--white)}
table.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:480px}
.tbl th{text-align:left;font:600 13px var(--f-body);color:var(--text);background:var(--secondary);padding:12px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{color:var(--text);font-weight:500}

.callout{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:20px 22px;border-radius:16px;background:var(--white);border:1px solid var(--line)}
.callout .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.callout .eyebrow{display:block;margin-bottom:2px}
.callout h3{font-size:18px;margin-bottom:6px}
.callout.warn{background:var(--coral-tint);border-color:var(--coral-line)}
.callout.warn .ico{background:var(--white);color:var(--coral)} .callout.warn .eyebrow{color:var(--coral)}
.callout.tip .ico{background:var(--mint-tint);color:var(--mint)} .callout.tip .eyebrow{color:var(--mint)}
.callout.key{background:var(--ink);border-color:var(--ink);color:var(--ink-muted)}
.callout.key h3,.callout.key strong{color:var(--ink-text)}
.callout.key .ico{background:var(--ink-hi);color:#000} .callout.key .eyebrow{color:var(--ink-hi)}

.acc{border:1px solid var(--line);border-radius:16px;background:var(--white);overflow:hidden}
.acc-item+.acc-item{border-top:1px solid var(--line)}
.acc-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;border:0;background:none;text-align:left;font:700 16.5px/1.35 var(--f-head);color:var(--text)}
.acc-q:hover{background:var(--secondary)}
.acc-q .st{display:flex;gap:12px;align-items:center}
.acc-q .tick{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center}
.acc-item.seen .tick{background:var(--mint);border-color:var(--mint)}
.acc-q .tick svg{opacity:0}
.acc-item.seen .tick svg{opacity:1;width:12px;height:12px;stroke:#fff;stroke-width:3}
.acc-q>svg{transition:transform .2s}
.acc-item.open .acc-q>svg{transform:rotate(180deg)}
.acc-a{padding:0 20px 20px 52px;color:var(--text)}

.tabs-bar{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{padding:12px 16px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-weight:600;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tab-panel{padding:24px 0 0;display:grid;gap:12px;max-width:70ch}
.tab-panel h3{font-size:20px}
.tab-panel ul{margin:0;padding-left:1.2em;display:grid;gap:6px}

.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.flip{perspective:1000px;min-height:210px;border:0;background:none;padding:0;text-align:left;display:block}
.flip-in{position:relative;display:block;width:100%;height:100%;min-height:210px;transform-style:preserve-3d;transition:transform .5s}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:18px;display:grid;align-content:space-between;gap:10px}
.flip-f{background:var(--accent-tint);border:1px solid var(--accent-line)}
.flip.fam-mint .flip-f{background:var(--mint-tint);border-color:var(--mint-line)}
.flip.fam-coral .flip-f{background:var(--coral-tint);border-color:var(--coral-line)}
.flip-f .ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--white);color:var(--accent)}
.flip-f .ft{display:grid;gap:4px}
.flip-f b{font:700 18px/1.3 var(--f-head)}
.flip-f small{color:var(--muted);font-size:13.5px}
.flip-f .hint{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;font-weight:600}
.flip.fam-mint .flip-f .hint,.flip.fam-mint .flip-f .eyebrow{color:var(--mint)}
.flip.fam-coral .flip-f .hint,.flip.fam-coral .flip-f .eyebrow{color:var(--coral)}
.flip-b{transform:rotateY(180deg);background:var(--ink);color:var(--ink-text);font-size:15px;align-content:center}
.flip-b .eyebrow{color:var(--ink-hi)}
.flip-b strong{color:var(--ink-hi)}
.flip.seen .flip-f{box-shadow:inset 0 0 0 2px var(--mint)}

.step-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.step-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:9999px;border:1px solid var(--line);background:var(--white);color:var(--muted);font-size:14px;font-weight:500}
.step-pill .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--secondary);font:700 13px var(--f-body);color:var(--text)}
.step-pill.seen .n{background:var(--accent-tint);color:var(--accent)}
.step-pill[aria-current="step"]{border-color:var(--accent);color:var(--text)}
.step-pill[aria-current="step"] .n{background:var(--accent);color:var(--on-accent)}
.step-card{padding:24px;border-radius:16px;background:var(--white);border:1px solid var(--line);display:grid;gap:12px}
.step-card h3{font-size:22px}
.step-card .kbd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
kbd{font:500 12.5px var(--f-mono);padding:3px 7px;border-radius:6px;border:1px solid var(--line-strong);border-bottom-width:2px;background:var(--white);color:var(--text)}
.step-ctl{display:flex;justify-content:space-between;gap:12px;margin-top:4px}

.numlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.numlist li{display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:center}
.numlist .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:900 15px var(--f-head)}
.numlist span span{color:var(--muted)}

.chk{display:grid;gap:8px}
.chk label{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--white);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk label:has(input:checked){border-color:var(--accent-line);background:var(--accent-tint)}

.dd{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dd>div{padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--white)}
.dd h3{font-size:16px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.dd ul{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:15px}
.dd .do h3{color:var(--mint)} .dd .dont h3{color:var(--coral)}

/* checks */
.kc{padding:26px;border-radius:16px;background:var(--white);border:1px solid var(--line);display:grid;gap:16px}
.kc-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.kc .q{font:700 1.2rem/1.4 var(--f-head);color:var(--text)}
.kc .ctx{color:var(--text)}
.opts{display:grid;gap:8px;border:0;padding:0;margin:0;min-width:0}
.opt{display:grid;grid-template-columns:22px auto 1fr auto;gap:12px;align-items:center;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--white);cursor:pointer}
.opt:hover{border-color:var(--line-strong);background:var(--primary)}
.opt input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.opt .ltr{font:900 14px var(--f-head);color:var(--accent);min-width:1ch}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.opt.right{border-color:var(--mint);background:var(--mint-tint)}
.opt.wrong{border-color:var(--coral);background:var(--coral-tint)}
.opt .mk svg{width:18px;height:18px}
.opt.right .mk{color:var(--mint)} .opt.wrong .mk{color:var(--coral)}
.kc-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:16px;border-radius:12px;background:var(--secondary)}
.fb .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor}
.fb.ok{color:var(--mint);background:var(--mint-tint)} .fb.no{color:var(--coral);background:var(--coral-tint)}
.fb p,.fb span{color:var(--text)} .fb strong{color:inherit}
.hint-row{display:grid;gap:8px}
.linkish{display:inline-flex;align-items:center;gap:6px;width:max-content;border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:14.5px;min-height:24px}
.linkish:hover{text-decoration:underline}
.hint-txt{padding:12px 14px;border-radius:12px;background:var(--accent-tint);border:1px solid var(--accent-line);font-size:15px}
.quiz-prog{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.quiz-prog .bar{flex:1}
.result{display:grid;gap:12px;justify-items:start}
.score{font:900 3.2rem/1 var(--f-head);color:var(--text)}
.review{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%}
.review li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px}
.review .ok{color:var(--mint)} .review .no{color:var(--coral)}

.sort-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:12px;border-radius:16px;border:1px dashed var(--line-strong);margin-bottom:14px;background:var(--white)}
.chip{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--white);color:var(--text);font-size:14.5px;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint);box-shadow:0 0 0 3px var(--accent-line)}
.chip.right{border-color:var(--mint);background:var(--mint-tint)}
.chip.wrong{border-color:var(--coral);background:var(--coral-tint)}
.chip small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bucket{display:grid;align-content:start;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--secondary);min-height:140px;text-align:left}
.bucket.ready{border-color:var(--accent);border-style:dashed}
.lab-hint{font-size:14.5px;color:var(--muted)}

/* spreadsheet */
.sheet-fig{margin:0;display:grid;gap:8px}
.sheet-fig figcaption{font-size:13.5px;color:var(--muted)}
.sheet-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--white)}
.sheet-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--secondary);font:600 13px var(--f-body);color:var(--text)}
.fx-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.fx-bar .fx{font-style:italic;color:var(--muted);font-weight:600}
.fx-bar code{background:none;border:0;color:var(--text);font-size:14px}
table.sheet{border-collapse:collapse;font:400 13.5px var(--f-body);min-width:100%}
.sheet th{background:var(--secondary);color:var(--muted);font:500 12px var(--f-body);padding:4px 8px;border:1px solid var(--line);text-align:center}
.sheet td{border:1px solid var(--line);padding:6px 10px;white-space:nowrap;color:var(--text)}
.sheet tr.hdr td{font-weight:600;background:var(--primary)}
.sheet td.num{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.hl{background:var(--mint-tint);outline:2px solid var(--mint);outline-offset:-2px}

/* hotspot image */
.hs-img{position:relative}
.hs-img img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line)}
.spot{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:var(--accent);color:var(--on-accent);font:700 13px var(--f-body);display:grid;place-items:center;box-shadow:0 0 0 4px var(--accent-line);animation:pulse 2s infinite}
.spot.seen{background:var(--mint);animation:none;box-shadow:none}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(14,116,144,.08)}}
.hs-panel{margin-top:14px;padding:18px 20px;border-radius:16px;background:var(--ink);color:var(--ink-muted);min-height:84px;display:grid;gap:4px}
.hs-panel h3{color:var(--ink-text);font-size:17px}
.hs-panel .eyebrow{color:var(--ink-hi)}

/* job aid card */
.jobaid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.jobaid .l{background:var(--ink);color:var(--ink-muted);padding:24px;display:grid;gap:10px;align-content:start}
.jobaid .l h3{color:var(--ink-text);font-size:22px}
.jobaid .l .eyebrow{color:var(--ink-hi)}
.jobaid .l .btn{background:var(--ink-hi);border-color:var(--ink-hi);color:#000}
.jobaid .r{background:var(--white);padding:20px 24px;display:grid;gap:4px;align-content:start}
.jobaid .row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.jobaid .row:last-child{border-bottom:0}
.jobaid .plus{color:var(--muted)}

/* reflection */
.refl .q{display:block;margin-bottom:10px;font:700 1.1rem/1.4 var(--f-head);color:var(--text)}
.refl textarea{width:100%;min-height:130px;border:1px solid var(--line-strong);border-radius:12px;padding:14px;background:var(--white);color:var(--text);resize:vertical}
.refl .row{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:14px;color:var(--muted)}

.done-card{padding:clamp(24px,4vw,40px);border-radius:24px;background:var(--ink);color:var(--ink-muted);display:grid;gap:16px}
.done-card h2{color:var(--ink-text);font-size:clamp(1.8rem,3.6vw,2.5rem);font-weight:900}
.done-card .eyebrow{color:var(--ink-hi)}
.done-card strong{color:var(--ink-text)}
.done-card ol{margin:0;padding-left:1.2em;display:grid;gap:6px;color:var(--ink-text)}
.done-card .seal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ink-hi);color:#000}
.done-card .seal svg{width:30px;height:30px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--white);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80}

/* lesson intro with illustration */
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:center;padding:24px;border-radius:24px;background:var(--white);border:1px solid var(--line)}
.intro.noimg{grid-template-columns:1fr}
.intro-t{display:grid;gap:12px}
.intro-img img{display:block;width:100%;max-height:260px;object-fit:contain}
@media (max-width:760px){.intro{grid-template-columns:1fr}.intro-img img{max-height:200px}}

/* decision scenario */
.dec{border:1px solid var(--line);border-radius:16px;background:var(--white);overflow:hidden}
.dec-head{display:flex;gap:14px;align-items:center;padding:16px 20px;background:var(--ink);color:var(--ink-muted)}
.dec-head b{display:block;color:var(--ink-text);font:700 17px var(--f-head)}
.dec-head .eyebrow{color:var(--ink-hi)}
.dec-head span:not(.eyebrow):not(.av){font-size:14px}
.dec-head img{margin-left:auto;height:72px;width:auto;border-radius:12px;background:var(--white);padding:4px}
.av{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--ink-hi);color:#000;font:900 16px var(--f-head)}
.dec-sit{padding:16px 20px 0;color:var(--muted)}
.dec-step{padding:16px 20px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.dec-step:last-of-type{border-bottom:0}
.dec .q{font:700 1.08rem/1.45 var(--f-head);color:var(--text)}
.dec>.lab-hint{padding:0 20px 16px}
.btn-opt{grid-template-columns:auto 1fr auto;text-align:left;font-size:15px}
.btn-opt:disabled{cursor:default;opacity:1}
.btn-opt:disabled:not(.right):not(.wrong){opacity:.6}

/* voice-over bar */
.vo{margin:0 0 28px}
.vo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--white);position:relative;overflow:hidden}
.vo-row::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent);opacity:0;transition:opacity .2s}
.vo.on .vo-row::before{opacity:1}
.vo-play{flex:none;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--on-accent);background:var(--accent)}
.vo-play:disabled{opacity:.5;cursor:not-allowed}
.vo-play .i{width:20px;height:20px;fill:currentColor;stroke:currentColor}
.vo-main{flex:1 1 260px;min-width:0;display:grid;gap:4px}
.vo-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vo-badge{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);color:var(--accent);background:var(--accent-tint);border:1px solid var(--accent-line);padding:4px 8px;border-radius:9999px}
.vo-badge .i{width:14px;height:14px}
.vo-src{font-size:12.5px;color:var(--muted)}
.vo-cap{font-size:15px;line-height:1.45;color:var(--text);min-height:1.45em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vo-prog{height:3px;border-radius:9999px;background:var(--line);overflow:hidden}
.vo-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.vo-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vo-sel{height:36px;border:1px solid var(--line-strong);border-radius:12px;background:var(--white);color:var(--text);padding:0 8px;font-size:13px;max-width:190px}
.vo-auto{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-height:36px}
.vo-auto input{accent-color:var(--accent);width:16px;height:16px}
.vo-tx-btn{height:36px;border:1px solid var(--line-strong);border-radius:12px;background:var(--white);color:var(--text);padding:0 12px;font-size:13px;font-weight:500}
.vo-tx-btn[aria-expanded="true"]{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.vo-tx{margin-top:8px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--white);font-size:14.5px;max-height:240px;overflow:auto}

/* keyboard help */
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--text);color:var(--white);padding:10px 16px;border-radius:12px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.kh-wrap{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px}
.kh{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--white);border-radius:16px;padding:20px 22px;box-shadow:0 30px 80px rgba(15,23,42,.3)}
.kh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kh h2{font-size:22px}

/* ---------- Responsive ---------- */
@media (max-width:1000px){
  .side{position:fixed;inset:0 auto 0 0;height:100%;transform:translateX(0);margin-left:0!important}
  #app.menu-closed .side{transform:translateX(-102%)}
  #app:not(.menu-closed) .scrim{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:35}
  .tb-hide{display:none}
}
@media (max-width:760px){
  .cover-body,.ti,.dd,.jobaid,.hero.has-img{grid-template-columns:1fr}
  .cover-body{padding-top:28px;gap:28px}
  .ti.right>figure{order:0}
  .page{padding:28px 16px 48px}
  .page-head{grid-template-columns:1fr}
  .topbar{padding-left:12px;padding-right:12px;gap:4px}
  .crumbs .far{display:none}
  .tb-label{display:none}
  .foot-status .txt{display:none}
  .opt{grid-template-columns:22px auto 1fr auto;padding:12px}
}
/* Shared Rise-style blocks: persona, profile card, phases, statement, reveal cards, job-aid download, results. SS Light tokens. */
.persona{display:grid;grid-template-columns:220px minmax(0,1fr);gap:28px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow-lift)}
.persona-img{background:var(--accent-tint);border-radius:16px;height:260px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.persona-img img{mix-blend-mode:multiply;height:100%;width:100%;object-fit:contain;object-position:bottom}
.persona-t{display:grid;gap:10px}
.persona-t h2{font-size:clamp(1.35rem,2.6vw,1.7rem);line-height:1.2}
.persona-t p{color:var(--muted)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:6px 0 0}
.facts div{background:var(--secondary);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.facts dt{font:900 1.6rem/1.1 var(--f-head);color:var(--accent)}
.facts dd{margin:2px 0 0;font-size:13.5px;color:var(--muted);line-height:1.35}

.profile{display:grid;grid-template-columns:170px minmax(0,1fr);gap:24px;align-items:center;border:2px solid var(--coral);border-radius:20px;padding:20px;background:var(--white)}
.profile-img{background:var(--coral-tint);border-radius:14px;height:210px;display:flex;align-items:flex-end;justify-content:center;overflow:hidden}
.profile-img img{mix-blend-mode:multiply;height:100%;width:100%;object-fit:contain;object-position:bottom}
.profile-t{display:grid;gap:8px}
.profile-t h2{font-size:1.5rem}
.plan-tag{justify-self:start;background:var(--coral);color:#fff;font:600 12px/16px var(--f-body);letter-spacing:.05em;text-transform:uppercase;padding:5px 10px;border-radius:8px}
.profile dl{margin:0;display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 14px;font-size:15px}
.profile dt{font-weight:700;color:var(--text)}
.profile dd{margin:0;color:var(--muted)}
.profile.calm{border-color:var(--accent)}.profile.calm .plan-tag{background:var(--accent)}.profile.calm .profile-img{background:var(--accent-tint)}

.phases{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;counter-reset:ph}
.phases li{position:relative;display:grid;gap:4px;padding:16px;border-radius:14px;background:var(--white);border:1px solid var(--line)}
.phases li span{font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.phases li b{font-family:var(--f-head);font-size:1.1rem}
.phases li em{font-style:normal;font-size:14px;color:var(--muted);line-height:1.45}
.phases li.now{background:var(--ink);border-color:var(--ink)}
.phases li.now span{color:var(--ink-hi)}.phases li.now b{color:var(--ink-text)}.phases li.now em{color:var(--ink-muted)}

.statement{display:grid;grid-template-columns:44px 1fr;gap:16px;align-items:start;background:var(--ink);color:var(--ink-text);border-radius:18px;padding:22px 24px}
.statement>svg{width:28px;height:28px;color:var(--ink-hi);margin-top:2px}
.statement p{font-size:1.1rem;line-height:1.6;color:var(--ink-text)}
.statement strong,.statement b{color:var(--ink-hi)}

.reveal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.rv{text-align:left;display:flex;flex-direction:column;gap:10px;min-height:110px;padding:16px 18px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--white);color:var(--text)}
.rv:hover{border-color:var(--accent)}
.rv b{font-size:16px;line-height:1.35}
.rv span{margin-top:auto;font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.rv.mild{background:#fef3c7;border-color:#d97706}.rv.mild span{color:#92400e}
.rv.sev{background:var(--coral);border-color:var(--coral);color:#fff}.rv.sev b{color:#fff}.rv.sev span{color:#fff}

.sheet-card{display:grid;grid-template-columns:150px minmax(0,1fr);gap:26px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:24px}
.sheet-thumb{aspect-ratio:210/297;background:var(--white);border:1px solid var(--line-strong);border-top:8px solid var(--accent);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;box-shadow:var(--shadow-lift)}
.sheet-thumb span{font:600 10px/14px var(--f-body);letter-spacing:.06em;color:var(--muted)}

.sheet-t h2{font-size:1.4rem;line-height:1.2}
.sheet-t p{color:var(--muted)}

.res-wrap{display:grid;gap:26px}
.res{display:grid;gap:10px}
.res-i{display:grid;grid-template-columns:36px minmax(0,190px) minmax(0,1fr);gap:14px;align-items:center;padding:14px 16px;border-radius:14px;border:1px solid var(--mint-line);background:var(--mint-tint)}

.sim-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 16px;background:var(--ink-2);color:var(--ink-muted);font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--ink-line)}

.sim-top svg{width:15px;height:15px;color:var(--ink-hi)}

@media (max-width:760px){
  .persona,.profile,.sheet-card{grid-template-columns:1fr}
  .persona-img{height:220px}
  .sheet-thumb{max-width:140px}

  .res-i{grid-template-columns:36px minmax(0,1fr)}.res-i em{grid-column:2}
}
@media (max-width:480px){.reveal,.facts{grid-template-columns:1fr}}
/* Simulation stages · dark "ink" frame from the SS Dark theme so the scenario reads as a separate space. */
.an{container-type:inline-size;background:var(--ink);color:var(--ink-text);font-family:var(--f-body)}
.an h3{color:var(--ink-text)}
.an b,.an strong{color:var(--ink-text)}
.an-hud{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--ink-2);border-bottom:1px solid var(--ink-line);flex-wrap:wrap;font-size:13px}
.an-loc{font-weight:600}
.an-clock{font-variant-numeric:tabular-nums;color:var(--ink-muted)}
.an-timer{margin-left:auto;display:flex;align-items:baseline;gap:8px;background:var(--ink-text);color:var(--ink);border-radius:99px;padding:4px 14px;font-weight:700;font-variant-numeric:tabular-nums;font-size:20px}
.an-timer small{font-size:10px;letter-spacing:.08em}
.an-timer.warn{background:#fbbf24}
.an-timer.crit{background:var(--ink-coral);animation:anb 1s steps(2) infinite}
.an-stab{display:flex;align-items:center;gap:8px}
.an-stab-bar{width:90px;height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.an-stab-bar i{display:block;height:100%;transition:width .6s,background .6s}
.an-stab b{font-variant-numeric:tabular-nums;min-width:22px}
.an-mute{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;background:none;color:var(--ink-text);border:1px solid rgba(255,255,255,.4);border-radius:9999px;padding:6px 12px;min-height:34px}
.an-mute svg{width:15px;height:15px}
.an-body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);min-height:520px}
.an-scene{position:relative;background:#e8eef2;overflow:hidden;min-height:340px}
.an-noah{mix-blend-mode:multiply;position:absolute;left:50%;bottom:-8%;height:88%;aspect-ratio:415/864;transform:translateX(-50%);transition:filter 1.2s}
.an-noah img{width:100%;height:100%;display:block}
.an-noah.worse{filter:saturate(1.3) hue-rotate(-8deg)}
.an-noah.pale{filter:grayscale(.75) brightness(1.12);animation:answay 1.8s ease-in-out infinite;transform-origin:50% 100%}
.an-swell{position:absolute;left:18%;top:17%;width:64%;height:26%;border-radius:50%;background:radial-gradient(closest-side,rgba(226,70,80,.32),rgba(226,70,80,0));pointer-events:none;transition:opacity 1.5s;animation:anp 2.4s ease-in-out infinite}
.an-noah.worse .an-swell{background:radial-gradient(closest-side,rgba(226,40,60,.5),rgba(226,40,60,0));animation-duration:1s}
.an-noah.calm .an-swell,.an-noah.fine .an-swell{opacity:0}
.an-hot{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:99px;border:3px solid #fff;background:var(--coral);color:#fff;font-weight:700;font-size:20px;line-height:1;z-index:3;box-shadow:0 2px 10px rgba(0,0,0,.35);display:grid;place-items:center;padding:0}
.an-hot svg{width:20px;height:20px}
.an-hot.got{background:var(--mint)}
.an-hot.hint{animation:anh 1.4s infinite}
.an-table{position:absolute;left:0;right:0;bottom:0;height:28%;background:#9c6b3f;border-top:12px solid #b9875a;z-index:2}
.an-plate{position:absolute;left:50%;top:14%;width:110px;height:34px;margin-left:-55px;border-radius:50%;background:#fff;box-shadow:inset 0 -6px 0 #e3ded6}
.an-cup{position:absolute;right:16%;top:-4px;width:38px;height:46px;border-radius:4px 4px 8px 8px;background:#fff;color:#0f172a;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center}
.an-cue{position:absolute;left:12px;top:12px;z-index:4;display:flex;align-items:center;gap:8px;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:6px 12px;border-radius:99px}
.an-wave{display:flex;gap:2px;align-items:center;height:14px}
.an-wave i{width:3px;height:100%;background:var(--ink-coral);border-radius:2px;animation:anw .9s ease-in-out infinite}
.an-wave i:nth-child(2){animation-delay:.15s}.an-wave i:nth-child(3){animation-delay:.3s}.an-wave i:nth-child(4){animation-delay:.45s}
.an-pen{position:absolute;right:12px;top:12px;z-index:4;background:#fff;color:var(--ink);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;width:130px;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.an-pen b{font-variant-numeric:tabular-nums;font-size:15px;color:var(--ink);margin-bottom:14px}
.an-thigh{width:100%;text-align:center;font-size:11px;font-weight:700;background:#f2c6a4;border-radius:30px 30px 8px 8px;padding:14px 0 6px;order:2}
.an-inj{order:1;position:relative;width:22px;height:70px;border-radius:6px;background:#f28b1e;transform:translateY(-14px);transition:transform .5s}
.an-inj i{position:absolute;left:0;right:0;top:0;height:28%;background:#1e5bb3;border-radius:6px 6px 0 0}
.an-inj.in{transform:translateY(6px)}
.an-inj.out{transform:translateY(-18px);opacity:.5}
.an-panel{padding:24px 26px;display:flex;flex-direction:column;background:var(--ink)}
.an-sec{display:flex;flex-direction:column;gap:12px;animation:anfu .3s ease both}
.an-sec h3{margin:0;font-size:1.45rem;line-height:1.25}
.an-sec h3:focus{outline:none}
.an-sec p{margin:0;font-size:15px;line-height:1.55;color:var(--ink-muted)}
.an-tag{align-self:flex-start;font:600 11px/16px var(--f-body);letter-spacing:.06em;text-transform:uppercase;background:var(--ink-3);color:var(--ink-hi);border:1px solid rgba(34,211,238,.35);padding:4px 10px;border-radius:9999px}
.an-tag.red{background:var(--ink-coral);color:var(--ink);border-color:var(--ink-coral)}
.an-tag.green{background:var(--ink-mint);color:var(--ink);border-color:var(--ink-mint)}
.an-ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;font-size:15px;color:var(--ink-text)}
.an-small{font-size:13px!important;color:#94a3b8!important}
.an-guide{display:inline-flex;align-items:center;gap:10px;font-size:14px;color:var(--ink-text);cursor:pointer}
.an-guide input{width:18px;height:18px;accent-color:var(--ink-hi)}
.an-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;background:var(--ink-hi);color:#000;border:none;border-radius:9999px;padding:0 22px;min-height:48px}
.an-btn:hover{background:#06b6d4}
.an-btn svg{width:18px;height:18px}
.an-signs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.an-signs li{border:1px dashed rgba(255,255,255,.3);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;font-size:14px;color:#94a3b8}
.an-signs li b{color:inherit;font-weight:600}
.an-signs li.on{border:1px solid rgba(255,255,255,.7);color:var(--ink-text);background:rgba(255,255,255,.05)}
.an-signs li span{font-size:13px;color:var(--ink-coral);font-weight:600;text-align:right}
.an-q{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--ink-line);padding-top:12px}
.an-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.an-opts{display:flex;flex-direction:column;gap:8px}
.an-opt{text-align:left;display:flex;gap:12px;align-items:flex-start;background:var(--ink-text);color:var(--ink);border:3px solid transparent;border-radius:14px;padding:12px 14px;font-size:14.5px;line-height:1.45;min-height:48px}
.an-opt:hover{border-color:var(--ink-hi)}
.an-opt.sm{font-weight:600;align-items:center}
.an-opt.hint{border-color:var(--ink-mint)}
.an-k{flex-shrink:0;width:28px;height:28px;border-radius:99px;background:var(--ink);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center}
.an-fb{background:var(--coral-tint);color:#881337!important;border-radius:12px;padding:10px 12px;font-weight:600}
.an-lock{display:flex;flex-direction:column;gap:12px;align-items:flex-start;border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:16px}
.an-lock-i{display:inline-flex;align-items:center;gap:6px;font:600 12px/16px var(--f-body);letter-spacing:.08em;text-transform:uppercase;background:var(--ink-coral);color:var(--ink);padding:4px 10px;border-radius:9999px}
.an-lock-i svg{width:14px;height:14px}
.an-meds{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.an-med{text-align:left;display:flex;flex-direction:column;gap:3px;background:var(--ink-text);color:var(--ink);border:3px solid transparent;border-radius:14px;padding:10px 12px;min-height:56px}
.an-med b{font-size:14px;color:var(--ink)}
.an-med span{font-size:12.5px;color:#475569}
.an-med:hover{border-color:var(--ink-hi)}
.an-med.hint{border-color:var(--ink-mint)}
.an-med.sel{border-color:var(--ink-mint);background:#d1fae5}
.an-med:disabled{cursor:default}
.an-quote{font-size:17px!important;font-weight:700;color:var(--ink-text)!important;border-top:3px solid var(--ink-coral);border-bottom:3px solid var(--ink-coral);padding:12px 0}
.an-breach{background:var(--ink-coral);color:var(--ink)!important;font-size:16.5px!important;font-weight:700;border-radius:14px;padding:14px 16px;line-height:1.45!important}
.an-vars{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12.5px;background:rgba(255,255,255,.06);border-radius:10px;padding:8px 12px;color:#94a3b8}
.an-vars b{color:#fbbf24;margin-right:10px}
.an-steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px}
.an-steps li{display:flex;flex-direction:column;gap:2px;animation:anfu .35s ease both;font-size:14.5px}
.an-steps li b{color:var(--ink-mint)}
.an-steps li span{color:var(--ink-muted);line-height:1.45}
.an-cap{background:#000;color:#fff!important;border-radius:10px;padding:10px 12px;font-size:14px!important;font-weight:600}
.an-rep{border-collapse:collapse;width:100%;font-size:13.5px}
.an-rep th,.an-rep td{border-bottom:1px solid var(--ink-line);padding:7px 4px;vertical-align:top;text-align:left;color:var(--ink-muted)}
.an-rep th{font-weight:700;color:var(--ink-text);width:120px}
.an button:focus-visible,.an input:focus-visible{outline:3px solid var(--ink-hi);outline-offset:2px}
@keyframes anb{50%{opacity:.55}}
@keyframes anp{50%{transform:scale(1.06)}}
@keyframes anh{0%{box-shadow:0 0 0 0 rgba(52,211,153,.8)}100%{box-shadow:0 0 0 16px rgba(52,211,153,0)}}
@keyframes anw{0%,100%{transform:scaleY(.3)}50%{transform:scaleY(1)}}
@keyframes answay{0%,100%{transform:translateX(-50%) rotate(-1.5deg)}50%{transform:translateX(-50%) rotate(1.5deg)}}
@keyframes anfu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@container (max-width:760px){.an-body{grid-template-columns:1fr}.an-scene{min-height:320px}.an-meds,.an-row{grid-template-columns:1fr}.an-timer{margin-left:0}}


/* ---------- EYLF · draft with issue pins ---------- */
.draft-wrap{display:grid;grid-template-columns:minmax(0,596px) minmax(0,1fr);gap:20px;align-items:start}
.draft{position:relative;background:var(--white);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lift);padding:18px;display:flex;flex-direction:column;gap:14px;max-width:100%;overflow:visible}
.draft-h{display:flex;gap:10px;align-items:center}.draft-h div{display:flex;flex-direction:column}.draft-h div span{font-size:12px;color:var(--muted)}
.draft-photo{position:relative;max-width:100%;overflow:hidden;border-radius:10px}
.draft-t{position:relative;background:var(--secondary);border-radius:10px;padding:12px 14px}.draft-t p{font-size:15px}
.draft-tags{display:flex;gap:8px;align-items:center}.draft-tags span{background:var(--secondary);border:1px solid var(--line);border-radius:99px;padding:4px 12px;font-size:12px;font-weight:600}
.pin{position:absolute;width:34px;height:34px;border-radius:99px;border:3px solid #fff;background:var(--coral);color:#fff;font-weight:700;font-size:14px;z-index:2;animation:pp 1.6s infinite;padding:0}
.pin.seen{background:var(--accent);animation:none}.pin.cur{box-shadow:0 0 0 4px var(--accent-line)}
@keyframes pp{0%{box-shadow:0 0 0 0 rgba(190,18,60,.5)}100%{box-shadow:0 0 0 12px rgba(190,18,60,0)}}
.issues{display:flex;flex-direction:column;gap:10px}
.iss{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:14px;padding:14px 16px;color:var(--muted);background:var(--white)}
.iss.on{background:var(--accent-tint);border-color:var(--accent-line);color:var(--text)}
.iss div{display:flex;flex-direction:column;gap:4px}.iss p{font-size:15px}
.iss-n{width:28px;height:28px;border-radius:99px;background:var(--secondary);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.iss.on .iss-n{background:var(--accent);color:#fff}
@media (max-width:1100px){.draft-wrap{grid-template-columns:1fr}}

/* story photo (560 × 380 scene, scaled) */
.sp{position:relative;overflow:hidden;border-radius:8px;background:#e9eff2;flex-shrink:0}
.sp-in{position:absolute;width:560px;height:380px;transform-origin:0 0}
.sp-in>*{position:absolute}
.sp-wall{inset:0;background:#e8eef2}.sp-floor{left:0;right:0;top:262px;bottom:0;background:#dccca9}.sp-skirt{left:0;right:0;top:256px;height:8px;background:#c9b78f}
.sp-win{left:330px;top:40px;width:90px;height:70px;background:#cfe3f2;border:6px solid #fff;border-radius:4px;box-sizing:border-box}
.sp-in img{mix-blend-mode:multiply}
.sp-blur{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:rgba(232,238,242,.4)}
.sp>div:not(.sp-in){position:absolute;box-sizing:border-box;pointer-events:none}
.sp-dim{background:rgba(11,15,20,.55)}.sp-crop{border:2px solid #fff}.sp-bz{border:1.5px dashed var(--accent)}
.sp-hint{border:2px dashed var(--coral);border-radius:8px}
.sp-live{border:2px solid var(--accent);background:rgba(34,211,238,.2)}.sp-live.crop{border-color:#fff;background:none}
.sp-flag{border:2px solid var(--coral);border-radius:4px}

/* ---------- EYLF · RoomJournal (960 × 640 stage) ---------- */
.rj-fit{width:100%;position:relative;overflow:hidden;background:#f6f8fa}
.rj-scale{position:absolute;left:0;top:0;transform-origin:0 0}
.rj{width:960px;height:640px;background:#f6f8fa;color:var(--text);position:relative;overflow:hidden;font-size:13px;line-height:1.45}
.rj button{font:inherit;color:inherit}
.rj-lbl{font:600 11px/14px var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

.rj-bar{height:48px;background:var(--ink);color:var(--ink-text);display:flex;align-items:center;gap:16px;padding:0 18px}

.rj-more{border:1px dashed var(--line-strong);border-radius:10px;padding:10px;color:var(--muted);font-size:12px}
.rj-aud{margin-top:auto;display:flex;flex-direction:column;gap:6px;font-size:12px}
.rj-main{position:absolute;left:190px;right:0;top:48px;bottom:0;display:flex;flex-direction:column}
.rj-head{height:60px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:#fff}
.rj-head div{display:flex;flex-direction:column}.rj-head b{font-size:16px}
.rj-status{margin-left:auto;border-radius:99px;padding:4px 12px;font-size:12px;font-weight:700;background:var(--secondary)}

.rj-tabs{height:44px;display:flex;gap:4px;padding:0 16px;align-items:flex-end;background:#fff;border-bottom:1px solid var(--line)}

.rj-body{flex:1;padding:16px 20px;overflow:hidden;position:relative}
.rj-two{display:grid;grid-template-columns:250px 1fr;gap:16px;height:100%}
.rj-col{display:flex;flex-direction:column;gap:8px;min-width:0}
.rj-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px}
.rj-notes{overflow:auto}.rj-note{display:flex;gap:8px;font-size:12.5px}.rj-note b{font-variant-numeric:tabular-nums}
.rj textarea{flex:1;resize:none;font:inherit;font-size:14px;line-height:1.6;padding:12px;border-radius:10px;border:1px solid var(--line-strong);background:#fff}
.rj-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.rj-btn{font-weight:600;font-size:13px;border-radius:10px;padding:8px 14px;border:1px solid var(--line-strong);background:#fff;text-align:left}
.rj-btn:hover{border-color:var(--accent)}
.rj-btn.sm{padding:6px 10px;flex:1;text-align:center}
.rj-btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;text-align:center}.rj-btn.pri:hover{background:var(--accentHover)}
.rj-btn:disabled{opacity:.45;cursor:not-allowed}
.rj-btn.tool{display:flex;flex-direction:column;gap:2px}.rj-btn.tool small{font-weight:400;font-size:11.5px;color:var(--muted)}
.rj-btn.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-tint)}
.rj-btn.out{display:flex;gap:8px;align-items:center;font-weight:500}.rj-btn.out b{width:20px}.rj-btn.out span{flex:1;font-size:12px;line-height:1.3}
.rj-btn.out i{font-style:normal;background:var(--accent);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px}
.rj-row{display:flex;gap:6px}
.rj-small{font-size:11.5px;color:var(--muted)}
.rj-media{display:flex;gap:14px}
.rj-photo{position:relative;flex-shrink:0;touch-action:none;user-select:none}.rj-photo.edit{cursor:crosshair}
.rj-consent div{display:flex;justify-content:space-between;font-size:12px}.rj-consent .ok{color:var(--mint)}.rj-consent .bad{color:var(--coral)}
.rj-sub{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
.rj-sub.on{background:var(--accent-tint);border-color:var(--accent-line)}.rj-sub input{margin-top:2px;accent-color:var(--accent)}
.rj-linked{margin-top:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rj-linked>span:not(.rj-lbl){background:#fff;border:1px solid var(--line-strong);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.rj-foot{height:60px;border-top:1px solid var(--line);background:#fff;display:flex;align-items:center;gap:14px;padding:0 20px;color:var(--muted)}
.rj-foot .rj-btn.pri{padding:10px 18px}
.rj-guide{margin-left:auto;display:inline-flex;gap:8px;align-items:center;font-size:12px;cursor:pointer}
.rj-over{position:absolute;inset:0;background:rgba(246,248,250,.97);padding:16px 20px;display:flex;flex-direction:column;gap:10px}
.rj-ot{font:900 17px var(--f-head)}.rj-ot:focus{outline:none}
.rj-res{background:#fff;border:1px solid var(--accent-line);border-radius:10px;padding:10px 14px;display:flex;gap:12px;align-items:flex-start}
.rj-res.no{border-color:var(--coral-line)}
.rj-res>div{flex:1;display:flex;flex-direction:column;gap:4px}
.rj-res .rj-btn.sm{flex:none}
.rj-ic{width:22px;height:22px;border-radius:99px;flex-shrink:0;background:var(--mint);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px}
.rj-ic svg{width:13px;height:13px}.rj-res.no .rj-ic{background:var(--coral)}
.rj .mut{color:var(--muted)}.rj .sm{font-size:12px}
.rj-success{display:grid;grid-template-columns:300px 1fr;gap:18px;background:#f6f8fa}
.rj-family{overflow:hidden}.rj-family p{font-size:12.5px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.rj-chips{display:flex;gap:4px;flex-wrap:wrap}.rj-chips span{background:var(--accent-tint);color:var(--accent);border-radius:99px;padding:2px 8px;font-size:11px;font-weight:700}
.rj-done{justify-content:center;gap:12px}.rj-done .rj-ot{font-size:26px;line-height:1.15}.rj-done .rj-btn{align-self:flex-start;flex:none}
.rj-modal{position:absolute;inset:0;background:rgba(11,15,20,.55);display:flex;align-items:center;justify-content:center;z-index:10}
.rj-dlg{width:760px;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 25px 50px -12px rgba(15,23,42,.35)}
.rj-dlg-h{background:var(--coral);color:#fff;padding:14px 20px;display:flex;align-items:center;gap:10px}
.rj-dlg-h span{width:26px;height:26px;border-radius:99px;background:#fff;color:var(--coral);display:grid;place-items:center;font-weight:800}.rj-dlg-h b{color:#fff}
.rj-dlg-b{display:grid;grid-template-columns:200px 1fr;gap:18px;padding:20px}
.rj-law{gap:9px;font-size:12.5px}.rj-law div{display:flex;flex-direction:column;gap:1px}
.rj-dlg-f{background:var(--secondary);padding:12px 20px;display:flex;align-items:center;gap:12px}.rj-dlg-f>span{flex:1;font-size:12.5px}.rj-dlg-f .rj-btn{flex:none}
.rj button:focus-visible,.rj input:focus-visible,.rj textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

@media (prefers-reduced-motion:reduce){.an *,.pin,.rj *,.fp *{animation:none!important;transition:none!important}}
.draft-h .dav{width:36px;height:36px;border-radius:99px;background:var(--accent-tint);color:var(--accent);display:grid;place-items:center;font:900 14px var(--f-head)}

/* ---------- Safeguarding · floor plan ---------- */
.sv-split{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:18px;align-items:start}
.sv-pw{border-radius:14px;overflow:hidden;border:1px solid var(--line-strong)}
.fp{container-type:inline-size;position:relative;aspect-ratio:100/62;background:#f4efe6;overflow:hidden}
.fp-z{position:absolute;box-sizing:border-box;transition:background .8s,box-shadow .8s}
.fp-z span{position:absolute;left:6px;bottom:4px;font-size:clamp(9px,1.6cqw,13px);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#334155}
.fp-hall{left:0;top:0;width:7%;height:100%;background:#d9dde3}
.fp-hall span{writing-mode:vertical-rl;left:auto;right:30%;bottom:8px}
.fp-room{left:7%;top:0;width:55%;height:100%;background:#f8f4ea;border-left:5px solid var(--ink);border-right:5px solid var(--ink)}
.fp-prep{left:62%;top:0;width:38%;height:68%;background:#e3f1ea}
.fp-kit{left:62%;top:68%;width:38%;height:32%;background:#e6e9ee;border-top:5px solid var(--ink)}
.fp-z.red{background:#f9d7df;box-shadow:inset 0 0 0 3px var(--coral)}
.fp-z.green{background:#c9ecdc;box-shadow:inset 0 0 0 4px var(--mint)}
.fp-door{position:absolute;left:calc(62% - 5px);width:6px;background:#f8f4ea}
.fp-gate{position:absolute;left:calc(7% - 6px);top:40%;height:16%;width:7px;background:var(--coral);transform-origin:50% 0;transition:transform .8s}
.fp-gate.open{transform:rotate(-70deg)}
.fp-f{position:absolute;background:#cbd5e1;border-radius:4px;font-size:clamp(8px,1.4cqw,12px);font-weight:700;color:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;transition:background .6s}
.fp-f.red{background:var(--coral);color:#fff}
.fp-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.fp-svg line{stroke:var(--accent);stroke-width:3;stroke-dasharray:6 5;animation:fpd 1s linear infinite}
.fp-kid{position:absolute;width:max(22px,4.4cqw);height:max(22px,4.4cqw);transform:translate(-50%,-50%);border-radius:99px;background:#fff;color:var(--ink);font-size:clamp(10px,2cqw,15px);font-weight:700;display:flex;align-items:center;justify-content:center;transition:left 1.1s ease-in-out,top 1.1s ease-in-out,box-shadow .5s;z-index:3}
.fp-kid.in{box-shadow:0 0 0 3px var(--mint)}
.fp-kid.out{box-shadow:0 0 0 3px var(--coral);background:var(--coral-tint)}
.fp-kid.dis{animation:fps .5s ease-in-out infinite}
.fp-kid.climb{animation:fpc .7s ease-in-out infinite}
.fp-ed{position:absolute;transform:translate(-50%,-50%);padding:3px 9px;border-radius:9999px;font-size:clamp(10px,1.8cqw,14px);font-weight:700;transition:left 1.2s ease-in-out,top 1.2s ease-in-out;z-index:4;display:flex;flex-direction:column;align-items:center;white-space:nowrap}
.fp-ed.you{background:var(--accent);color:#fff}
.fp-ed.sam{background:var(--ink);color:#fff}
.fp-ed em{font-style:normal;font-size:.75em;background:var(--coral);border-radius:4px;padding:0 4px;margin-top:2px}
.fp-hot{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:99px;border:3px solid #fff;background:var(--coral);color:#fff;font-weight:700;z-index:6;box-shadow:0 2px 8px rgba(0,0,0,.3);display:grid;place-items:center;padding:0}
.fp-hot svg{width:18px;height:18px}
.fp-hot.got{background:var(--mint)}
.fp button:focus-visible{outline:3px solid var(--ink-hi);outline-offset:2px}
@keyframes fpd{to{stroke-dashoffset:-22}}
@keyframes fps{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-56%,-50%)}}
@keyframes fpc{0%,100%{transform:translate(-50%,-50%)}50%{transform:translate(-50%,-62%)}}

/* ---------- Safeguarding · simulation stage ---------- */
.sv .an-body{grid-template-columns:minmax(0,6fr) minmax(0,5fr)}
.sv-sp{margin-left:auto}
.sv-clk{font-variant-numeric:tabular-nums;color:var(--ink-muted);display:inline-flex;gap:8px;align-items:center}
.sv-tl{background:#fbbf24;color:var(--ink);border-radius:4px;padding:1px 6px;font-size:10px;letter-spacing:.08em}
.sv-pill{border-radius:9999px;padding:4px 12px;font-weight:600;background:var(--ink-3);color:var(--ink-text)}
.sv-pill b{font-variant-numeric:tabular-nums;color:inherit}
.sv-pill.ok{background:var(--ink-mint);color:var(--ink)}.sv-pill.warn{background:#fbbf24;color:var(--ink)}.sv-pill.bad{background:var(--ink-coral);color:var(--ink)}
.sv-nb{width:70px;height:10px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;display:block}
.sv-nb i{display:block;height:100%;background:#fbbf24;transition:width .8s}
.sv-stage{position:relative;background:#e8eef2;display:flex;align-items:center;padding:14px}
.sv-stage .fp{width:100%;border-radius:10px}
.sv-badge{position:absolute;left:14px;right:14px;top:14px;z-index:8;background:var(--coral);color:#fff;border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;box-shadow:0 8px 20px rgba(0,0,0,.25);animation:anfu .3s ease both}
.sv-badge b{color:#fff;letter-spacing:.08em;font-size:12px}.sv-badge span{font-size:13px}
.sv-cue{position:absolute;left:14px;bottom:14px;z-index:8;background:var(--ink);color:#fff;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:99px}
.sv-evs{display:flex;flex-direction:column;gap:8px}
.sv-ev{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--ink-2);border:1px solid var(--ink-line);border-radius:14px;padding:8px 12px;animation:anfu .3s ease both}
.sv-ev img{width:56px;height:56px;object-fit:cover;object-position:top;border-radius:10px;background:#fff}
.sv-ev p{font-size:14px!important}
.an-steps.bad li span{color:var(--ink-coral)}
.sv-ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;color:var(--ink-muted);font-size:14.5px;line-height:1.5}
.sv-ok{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center;background:rgba(52,211,153,.12);border:1px solid rgba(52,211,153,.4);border-radius:14px;padding:10px}
.sv-ok img{width:110px;height:90px;object-fit:cover;border-radius:10px;background:#fff}
.sv-ok div{display:flex;flex-direction:column;gap:2px}.sv-ok span{color:var(--ink-muted);font-size:13px}
@container (max-width:760px){.sv .an-body{grid-template-columns:1fr}}
@media (max-width:1000px){.sv-split{grid-template-columns:1fr}}
.an [hidden],.rj [hidden],.sim-frame [hidden]{display:none!important}
.fp-room>span{left:auto;right:8px}
.draft-photo{width:100%;max-width:560px}.draft-pin-box{position:absolute;left:0;top:0;width:560px;height:380px;transform-origin:0 0}
@media (max-width:640px){.draft{padding:12px}.draft-t .pin{right:-6px}}
.rj-tip{display:none}@media (max-width:700px){.rj-tip{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--muted);margin-bottom:12px}.rj-tip svg{width:18px;height:18px;flex:none;margin-top:2px;color:var(--accent)}}
</style>

or each room. When one educator leaves 8 toddlers, it\u2019s 1:8.<\/p><\/div>\n<div class=\"bx\"><h2>Where to stand during a transition<\/h2><ul><li>Stand at the doorway threshold, facing both zones<\/li><li>Keep your back to a wall, never to the room<\/li><li>Close or check gates and latches before children move<\/li><li>Make sure someone has line of sight to climbing furniture and blind corners<\/li><\/ul><\/div>\n<\/div>\n<div class=\"bx tint\"><h2>Handover script<\/h2><p style=\"font-size:11pt\">\u201cSam, ratio shift: I\u2019ve got the doorway and the prep area, all 8 in sight. Can you take Oliver?\u201d Wait for a nod or a \u201cGot it\u201d before you move.<\/p><\/div>\n<div class=\"g2\">\n<div class=\"bx sev\"><h2>Never<\/h2><ul><li>Leave the room \u201cjust for 30 seconds\u201d when it puts the room out of ratio<\/li><li>Call a handover across a noisy room<\/li><li>Treat a gate or latch as supervision<\/li><li>Turn your back on the room to do paperwork during a transition<\/li><\/ul><\/div>\n<div class=\"bx mint\"><h2>Instead<\/h2><ul><li>Ask the kitchen or a floater to bring trays to the door<\/li><li>Use the room phone or intercom for help<\/li><li>Pause the routine. Being late is fine; being out of ratio is not<\/li><li>If a child leaves unsupervised: locate the child, notify the nominated supervisor, and report to the regulatory authority within 24 hours<\/li><\/ul><\/div>\n<\/div>\n<div class=\"ft\"><span>Phased induction: Days 1\u20135 shadowing (supernumerary) \u00b7 Days 6\u201313 supported practice \u00b7 Day 14 counted in ratio \u00b7 Weeks 3\u201312 consolidation. Check ratios against your state\u2019s current requirements.<\/span><\/div>\n<\/div>\n<script>(function(){var p=document.querySelector(\".pg\");function fit(){if(p.querySelector(\".ja-head\")){p.classList.add(\"multi\");return}var h=p.scrollHeight,a=p.getBoundingClientRect().width*297/210-40;document.documentElement.style.setProperty(\"--fit\",h>a?(a/h).toFixed(3):1)}fit();addEventListe         h('div', { class: 'fp-f', style: { left: '84%', top: '76%', width: '14%', height: '20%' } }, 'Trays'),
        svg, kids, sam, you);

        const yp = A && step >= 1 ? [82, 86] : C && step >= 2 ? [62, 40] : [54, 68];
