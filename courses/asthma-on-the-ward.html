  --mint:#047857; --mint-tint:#e6f2ee; --mint-line:#b4d6cb;
  --coral:#be123c; --coral-tint:#f9e8ec; --coral-line:#ebb8c4;
  --line:#e1e3e7; --line-strong:#c9cdd2; --logo-cyan:#0cc0df; --logo-green:#7ed957;
  --shadow-lift:0 16px 30px -10px rgba(15,23,42,.15);
  /* dark panels reuse the Dark theme's values */
  --ink:#0b0f14; --ink-2:#151b23; --ink-3:#1c2430; --ink-line:rgba(255,255,255,.12); --ink-text:#f8fafc; --ink-muted:#cbd5e1; --ink-hi:#22d3ee; --ink-mint:#34d399; --ink-coral:#fb7185;
  /* engine aliases */
  --canvas:var(--primary); --surface:var(--white); --sunken:var(--secondary); --strong:var(--line-strong);
  --body:var(--text); --faint:var(--muted);
  --acc:var(--accent); --acc-ink:var(--accent); --on-acc:var(--on-accent); --acc-soft:var(--accent-tint);
  --ok:var(--mint); --ok-ink:var(--mint); --ok-soft:var(--mint-tint);
  --bad:var(--coral); --bad-soft:var(--coral-tint);
  --f-head:"Lato","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --side:320px; color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--canvas);color:var(--body);font:400 16px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--f-head);font-weight:700;color:var(--text);margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
strong,b{color:var(--text);font-weight:700}
code{font-family:var(--f-mono);font-size:.86em;background:var(--sunken);border:1px solid var(--line);padding:.05em .35em;border-radius:6px;color:var(--accent)}
.eyebrow{display:inline-block;font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.sr{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
svg.i{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- App shell ---------- */
#app{height:100%;display:flex}
.side{width:var(--side);flex:none;background:var(--white);color:var(--text);display:flex;flex-direction:column;height:100%;position:relative;z-index:40;border-right:1px solid var(--line);transition:margin-left .28s ease,transform .28s ease}
#app.menu-closed .side{margin-left:calc(-1 * var(--side));visibility:hidden;transition:margin-left .28s ease,transform .28s ease,visibility 0s linear .28s}
.side-head{padding:22px 20px 16px;border-bottom:1px solid var(--line);display:grid;gap:10px}
.side-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:12px;border:0;background:transparent;color:inherit}
.icon-btn:hover{background:var(--secondary)}
.side-title{font:700 20px/1.2 var(--f-head);color:var(--text)}
.series-chip{display:inline-flex;align-items:center;gap:6px;width:max-content;font:600 12px/1 var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--on-accent);background:var(--accent);padding:6px 10px;border-radius:9999px}
.series-chip svg{width:14px;height:14px}
.side-prog{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.bar{height:6px;border-radius:9999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:inherit;transition:width .4s ease}
.side-link{display:inline-flex;align-items:center;gap:8px;color:var(--text);background:none;border:0;padding:4px 0;font-size:14px;width:max-content}
.side-link:hover{text-decoration:underline}
.toc{flex:1;overflow-y:auto;padding:8px 12px 16px}
.mod{padding:12px 4px 4px}
.mod-btn{width:100%;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;background:none;border:0;color:var(--text);text-align:left;padding:4px 4px 8px}
.mod-btn .k{display:block;margin-bottom:3px;font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.mod-btn .t{font:700 16px/1.25 var(--f-head)}
.mod-btn .c{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12px}
.mod-btn svg{transition:transform .2s}
.mod.closed .mod-btn svg{transform:rotate(-90deg)}
.mod.closed .scr-list{display:none}
.scr-list{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.scr{width:100%;display:grid;grid-template-columns:18px 1fr auto;align-items:center;gap:12px;padding:9px 10px;border-radius:12px;border:0;background:transparent;color:var(--muted);text-align:left;font-size:14.5px;line-height:1.35}
.scr:hover:not(:disabled){background:var(--secondary);color:var(--text)}
.scr:disabled{cursor:not-allowed}
.scr .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center;background:var(--white)}
.scr.done .dot{background:var(--mint);border-color:var(--mint)}
.scr.done .dot svg{width:11px;height:11px;stroke:#fff;stroke-width:3}
.scr.cur{background:var(--accent-tint);color:var(--text);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.scr.cur .dot{border-color:var(--accent);background:var(--accent)}
.scr .m{font-size:12px;color:var(--muted)}
.scr .m svg{width:14px;height:14px}
.side-foot{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:4px;padding:8px;border-top:1px solid var(--line)}
.side-foot button{display:grid;justify-items:center;gap:4px;padding:10px 4px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:13px}
.side-foot button:hover,.side-foot button[aria-pressed="true"]{background:var(--secondary);color:var(--text)}
.side-note{padding:0 16px 12px;font-size:12px;color:var(--muted)}
.drawer{position:absolute;left:0;right:0;bottom:78px;max-height:60%;overflow:auto;background:var(--white);border-top:1px solid var(--line);box-shadow:0 -12px 30px -12px rgba(15,23,42,.15);padding:18px 20px;display:grid;gap:12px}
.drawer h3{font-size:16px}
.drawer dl{margin:0;display:grid;gap:10px}
.drawer dt{font-weight:600;font-size:14px}
.drawer dt a{display:inline-flex;align-items:center;gap:6px;color:var(--accent)}
.drawer dd{margin:0;color:var(--muted);font-size:13.5px}
.drawer textarea{width:100%;min-height:140px;background:var(--white);border:1px solid var(--line-strong);border-radius:12px;padding:10px}
.scrim{display:none}
.side-logo,.logo{display:flex;align-items:center;gap:10px;font:900 16px/1.15 var(--f-head);color:var(--text)}
.side-logo img,.logo img{width:40px;height:40px;border-radius:12px;background:#000;object-fit:cover;flex:none}
.side-logo small,.logo small{display:block;font:500 12px var(--f-body);color:var(--muted);letter-spacing:0}

.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 20px;padding-top:calc(10px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--line);background:var(--white);color:var(--muted)}
.crumbs{flex:1;min-width:0;display:flex;align-items:center;gap:8px;font-size:14.5px;white-space:nowrap;overflow:hidden}
.crumbs span{overflow:hidden;text-overflow:ellipsis}
.crumbs .now{color:var(--text);font-weight:500}
.crumbs svg{width:14px;height:14px}
.tb-meta{display:flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap}
.tb-btn{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--text);font-size:14px;white-space:nowrap}
.tb-btn:hover{background:var(--secondary)}
.scroll{flex:1;overflow-y:auto;scroll-behavior:smooth;scroll-padding:24px 0 96px}
@media (prefers-reduced-motion:reduce){.scroll{scroll-behavior:auto}}
.page{max-width:920px;margin:0 auto;padding:44px 24px 72px}
.page.wide{max-width:1120px}
.page-head{display:grid;grid-template-columns:1fr auto;gap:8px 24px;align-items:end;padding-bottom:22px;border-bottom:1px solid var(--line);margin-bottom:32px}
.page-head .eyebrow{grid-column:1/-1}
#scrtitle:focus{outline:none}
.page-head h1{font-size:clamp(2rem,4.4vw,2.6rem);line-height:1.1;font-weight:900;letter-spacing:-.025em}
.page-head .meta{display:flex;gap:18px;color:var(--muted);font-size:13px;align-items:center;padding-bottom:8px}
.page-head .meta span{display:inline-flex;gap:6px;align-items:center}
.blocks{display:grid;gap:44px}
.footnav{border-top:1px solid var(--line);background:var(--white);padding:0 20px calc(12px + env(safe-area-inset-bottom,0px))}
.footnav .bar{background:var(--line);margin:0 -20px 12px;border-radius:0;height:3px}
.footnav-row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.nav-btn{display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border-radius:9999px;border:1px solid var(--line-strong);background:var(--white);color:var(--text);font-weight:600}
.nav-btn:disabled{opacity:.5;cursor:not-allowed}
.nav-btn.next{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.nav-btn.next:not(:disabled):hover{background:var(--accentHover);border-color:var(--accentHover)}
.foot-status{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;text-align:center}
.foot-status .sep{width:1px;height:14px;background:var(--line-strong)}
.foot-status .need{color:var(--accent);font-weight:600}

/* ---------- Cover ---------- */
.cover{flex:1;min-width:0;min-height:100%;display:grid;grid-template-rows:auto 1fr;background:var(--canvas)}
.cover-top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px max(16px,4vw);border-bottom:1px solid var(--line);background:var(--white)}
.cover-body{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:48px;align-items:start;max-width:1180px;width:100%;margin:0 auto;padding:48px max(16px,4vw) 64px}
.eyebrow-row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.cover-body h1{font-size:clamp(2.3rem,5vw,3.75rem);line-height:1.05;margin:16px 0 18px;letter-spacing:-.025em;font-weight:900}
.cover-body .lede{font-size:18px;line-height:1.6;max-width:56ch}
.cover-facts{display:flex;flex-wrap:wrap;gap:28px;margin:28px 0}
.cover-facts div{display:grid;gap:2px}
.cover-facts dt{font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.cover-facts dd{margin:0;font:700 19px var(--f-head);color:var(--text)}
.cover-cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
.cover-note{margin-top:24px;font-size:13.5px;color:var(--muted);max-width:60ch}
.cover-side{display:grid;gap:16px}
.cover-art{display:flex;justify-content:center;align-items:flex-end;gap:8px;background:var(--white);border:1px solid var(--line);border-radius:24px;padding:18px;min-height:220px}
.cover-art img{max-height:280px;max-width:100%;object-fit:contain}
.cover-art.many img{max-height:240px;max-width:32%}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 24px;border-radius:9999px;border:1px solid var(--accent);background:var(--accent);color:var(--on-accent);font-weight:600;font-size:16px;text-decoration:none}
.btn:hover{background:var(--accentHover);border-color:var(--accentHover)}
.btn.ghost{background:var(--white);color:var(--text);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--secondary);border-color:var(--text)}
.btn.sm{min-height:40px;padding:0 18px;font-size:14.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.on-dark{background:var(--ink-hi);border-color:var(--ink-hi);color:#000}
.btn.on-dark:hover{background:#06b6d4;border-color:#06b6d4}
.cover-path{display:grid;gap:10px}
.path-card{display:grid;grid-template-columns:44px 1fr;gap:14px;align-items:start;padding:14px 16px;border-radius:16px;background:var(--white);border:1px solid var(--line);text-align:left;color:var(--text);transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
.path-card:not(:disabled):hover{transform:translateY(-2px);box-shadow:var(--shadow-lift);border-color:var(--accent-line)}
.path-card:disabled{cursor:not-allowed;opacity:.75}
.path-card .n{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:900 17px var(--f-head);color:var(--accent);background:var(--accent-tint)}
.path-card.done .n{background:var(--mint-tint);color:var(--mint)}
.path-card .k{display:block;font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--accent)}
.path-card .t{display:block;font:700 17px/1.3 var(--f-head);margin:2px 0}
.path-card .p{display:block;color:var(--muted);font-size:14px;line-height:1.5}

/* ---------- Blocks ---------- */
.blk{position:relative;min-width:0}
.blk-head{display:grid;gap:6px;margin-bottom:18px}
.blk-head h2{font-size:clamp(1.35rem,2.6vw,1.7rem);line-height:1.2}
.blk-head p{color:var(--muted)}
.req{display:inline-flex;align-items:center;gap:6px;width:max-content;font:600 12px/16px var(--f-body);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);background:var(--accent-tint);border:1px solid var(--accent-line);padding:4px 10px;border-radius:9999px}
.req.ok{color:var(--mint);background:var(--mint-tint);border-color:var(--mint-line)}
.req svg{width:13px;height:13px}
.prose{display:grid;gap:14px;max-width:70ch}
.prose ul,.prose ol{margin:0;padding-left:1.25em;display:grid;gap:6px}
.prose h2{font-size:clamp(1.35rem,2.6vw,1.7rem);line-height:1.2}
.prose a{color:var(--accent)}
.lead{font-size:clamp(1.12rem,2vw,1.3rem);line-height:1.6;color:var(--text);max-width:62ch}
.quote{margin:0;border-left:0;padding:20px 24px;border-radius:16px;background:var(--white);border:1px solid var(--line);font:700 1.2rem/1.45 var(--f-head);color:var(--text);display:grid;gap:8px}
.quote.sm{font-size:1.02rem;padding:16px 18px}
.quote small{font:400 14px var(--f-body);color:var(--muted)}

.hero{position:relative;overflow:hidden;border-radius:24px;background:var(--white);border:1px solid var(--line);padding:clamp(26px,5vw,44px);display:grid;gap:24px;grid-template-columns:1fr}
.hero.has-img{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);align-items:center}
.hero-t{display:grid;gap:16px}
.hero h2{font-size:clamp(1.9rem,4.4vw,2.8rem);line-height:1.08;font-weight:900;letter-spacing:-.025em;max-width:18ch}
.hero p{font-size:18px;max-width:56ch}
.hero dl{display:flex;flex-wrap:wrap;gap:28px;margin:4px 0 0}
.hero dt{font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.hero dd{margin:0;font:900 24px var(--f-head);color:var(--text)}
.hero-img{display:grid;place-items:center}
.hero-img img{max-width:100%;max-height:300px;object-fit:contain}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip-s,.chips .chip{display:inline-flex;align-items:center;padding:6px 12px;border-radius:9999px;background:var(--secondary);border:1px solid var(--line);font-size:13px;color:var(--text)}

.ph{position:relative;display:grid;place-items:center;text-align:center;aspect-ratio:16/10;max-width:100%;border-radius:16px;border:1px dashed var(--line-strong);color:var(--muted);font-size:14px;padding:20px;background:repeating-linear-gradient(45deg,var(--secondary) 0 10px,var(--white) 10px 20px)}
.ph svg{width:28px;height:28px;margin:0 auto 8px}
.ti{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:32px;align-items:center}
.ti.right>figure,.ti.right>.ph{order:2}
.ti .prose h2{font-size:1.5rem}
.pic{margin:0;display:grid;gap:8px}
.pic img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line);background:var(--white)}
.pic.contain img{max-height:360px;object-fit:contain;padding:12px}
.pic.svg>div{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--white)}
.pic.svg svg{display:block;width:100%;height:auto}
.pic figcaption{font-size:13.5px;color:var(--muted)}

.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.icard{padding:22px;border-radius:16px;background:var(--white);border:1px solid var(--line);display:grid;gap:8px;align-content:start}
.icard .ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.icard.fam-mint .ico{background:var(--mint-tint);color:var(--mint)}
.icard.fam-coral .ico{background:var(--coral-tint);color:var(--coral)}
.icard h3{font-size:17px}
.icard p{font-size:15px;color:var(--muted)}

.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--white)}
table.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:480px}
.tbl th{text-align:left;font:600 13px var(--f-body);color:var(--text);background:var(--secondary);padding:12px 16px;border-bottom:1px solid var(--line)}
.tbl td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl td:first-child{color:var(--text);font-weight:500}

.callout{display:grid;grid-template-columns:44px 1fr;gap:16px;padding:20px 22px;border-radius:16px;background:var(--white);border:1px solid var(--line)}
.callout .ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.callout .eyebrow{display:block;margin-bottom:2px}
.callout h3{font-size:18px;margin-bottom:6px}
.callout.warn{background:var(--coral-tint);border-color:var(--coral-line)}
.callout.warn .ico{background:var(--white);color:var(--coral)} .callout.warn .eyebrow{color:var(--coral)}
.callout.tip .ico{background:var(--mint-tint);color:var(--mint)} .callout.tip .eyebrow{color:var(--mint)}
.callout.key{background:var(--ink);border-color:var(--ink);color:var(--ink-muted)}
.callout.key h3,.callout.key strong{color:var(--ink-text)}
.callout.key .ico{background:var(--ink-hi);color:#000} .callout.key .eyebrow{color:var(--ink-hi)}

.acc{border:1px solid var(--line);border-radius:16px;background:var(--white);overflow:hidden}
.acc-item+.acc-item{border-top:1px solid var(--line)}
.acc-q{width:100%;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 20px;border:0;background:none;text-align:left;font:700 16.5px/1.35 var(--f-head);color:var(--text)}
.acc-q:hover{background:var(--secondary)}
.acc-q .st{display:flex;gap:12px;align-items:center}
.acc-q .tick{width:20px;height:20px;flex:none;border-radius:50%;border:2px solid var(--line-strong);display:grid;place-items:center}
.acc-item.seen .tick{background:var(--mint);border-color:var(--mint)}
.acc-q .tick svg{opacity:0}
.acc-item.seen .tick svg{opacity:1;width:12px;height:12px;stroke:#fff;stroke-width:3}
.acc-q>svg{transition:transform .2s}
.acc-item.open .acc-q>svg{transform:rotate(180deg)}
.acc-a{padding:0 20px 20px 52px;color:var(--text)}

.tabs-bar{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line)}
.tab{padding:12px 16px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);font-weight:600;white-space:nowrap;margin-bottom:-1px}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{color:var(--accent);border-color:var(--accent)}
.tab-panel{padding:24px 0 0;display:grid;gap:12px;max-width:70ch}
.tab-panel h3{font-size:20px}
.tab-panel ul{margin:0;padding-left:1.2em;display:grid;gap:6px}

.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.flip{perspective:1000px;min-height:210px;border:0;background:none;padding:0;text-align:left;display:block}
.flip-in{position:relative;display:block;width:100%;height:100%;min-height:210px;transform-style:preserve-3d;transition:transform .5s}
.flip.on .flip-in{transform:rotateY(180deg)}
.flip-f,.flip-b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:18px;display:grid;align-content:space-between;gap:10px}
.flip-f{background:var(--accent-tint);border:1px solid var(--accent-line)}
.flip.fam-mint .flip-f{background:var(--mint-tint);border-color:var(--mint-line)}
.flip.fam-coral .flip-f{background:var(--coral-tint);border-color:var(--coral-line)}
.flip-f .ico{width:40px;height:40px;border-radius:8px;display:grid;place-items:center;background:var(--white);color:var(--accent)}
.flip-f .ft{display:grid;gap:4px}
.flip-f b{font:700 18px/1.3 var(--f-head)}
.flip-f small{color:var(--muted);font-size:13.5px}
.flip-f .hint{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;font-weight:600}
.flip.fam-mint .flip-f .hint,.flip.fam-mint .flip-f .eyebrow{color:var(--mint)}
.flip.fam-coral .flip-f .hint,.flip.fam-coral .flip-f .eyebrow{color:var(--coral)}
.flip-b{transform:rotateY(180deg);background:var(--ink);color:var(--ink-text);font-size:15px;align-content:center}
.flip-b .eyebrow{color:var(--ink-hi)}
.flip-b strong{color:var(--ink-hi)}
.flip.seen .flip-f{box-shadow:inset 0 0 0 2px var(--mint)}

.step-nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.step-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 6px;border-radius:9999px;border:1px solid var(--line);background:var(--white);color:var(--muted);font-size:14px;font-weight:500}
.step-pill .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--secondary);font:700 13px var(--f-body);color:var(--text)}
.step-pill.seen .n{background:var(--accent-tint);color:var(--accent)}
.step-pill[aria-current="step"]{border-color:var(--accent);color:var(--text)}
.step-pill[aria-current="step"] .n{background:var(--accent);color:var(--on-accent)}
.step-card{padding:24px;border-radius:16px;background:var(--white);border:1px solid var(--line);display:grid;gap:12px}
.step-card h3{font-size:22px}
.step-card .kbd{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
kbd{font:500 12.5px var(--f-mono);padding:3px 7px;border-radius:6px;border:1px solid var(--line-strong);border-bottom-width:2px;background:var(--white);color:var(--text)}
.step-ctl{display:flex;justify-content:space-between;gap:12px;margin-top:4px}

.numlist{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.numlist li{display:grid;grid-template-columns:36px 1fr;gap:14px;align-items:center}
.numlist .n{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--on-accent);font:900 15px var(--f-head)}
.numlist span span{color:var(--muted)}

.chk{display:grid;gap:8px}
.chk label{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--white);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.chk label:has(input:checked){border-color:var(--accent-line);background:var(--accent-tint)}

.dd{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.dd>div{padding:20px;border-radius:16px;border:1px solid var(--line);background:var(--white)}
.dd h3{font-size:16px;margin-bottom:10px;display:flex;gap:8px;align-items:center}
.dd ul{margin:0;padding-left:1.1em;display:grid;gap:6px;font-size:15px}
.dd .do h3{color:var(--mint)} .dd .dont h3{color:var(--coral)}

/* checks */
.kc{padding:26px;border-radius:16px;background:var(--white);border:1px solid var(--line);display:grid;gap:16px}
.kc-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.kc .q{font:700 1.2rem/1.4 var(--f-head);color:var(--text)}
.kc .ctx{color:var(--text)}
.opts{display:grid;gap:8px;border:0;padding:0;margin:0;min-width:0}
.opt{display:grid;grid-template-columns:22px auto 1fr auto;gap:12px;align-items:center;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--white);cursor:pointer}
.opt:hover{border-color:var(--line-strong);background:var(--primary)}
.opt input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.opt .ltr{font:900 14px var(--f-head);color:var(--accent);min-width:1ch}
.opt:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.opt.right{border-color:var(--mint);background:var(--mint-tint)}
.opt.wrong{border-color:var(--coral);background:var(--coral-tint)}
.opt .mk svg{width:18px;height:18px}
.opt.right .mk{color:var(--mint)} .opt.wrong .mk{color:var(--coral)}
.kc-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fb{display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:16px;border-radius:12px;background:var(--secondary)}
.fb .ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:2px solid currentColor}
.fb.ok{color:var(--mint);background:var(--mint-tint)} .fb.no{color:var(--coral);background:var(--coral-tint)}
.fb p,.fb span{color:var(--text)} .fb strong{color:inherit}
.hint-row{display:grid;gap:8px}
.linkish{display:inline-flex;align-items:center;gap:6px;width:max-content;border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:14.5px;min-height:24px}
.linkish:hover{text-decoration:underline}
.hint-txt{padding:12px 14px;border-radius:12px;background:var(--accent-tint);border:1px solid var(--accent-line);font-size:15px}
.quiz-prog{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:14px}
.quiz-prog .bar{flex:1}
.result{display:grid;gap:12px;justify-items:start}
.score{font:900 3.2rem/1 var(--f-head);color:var(--text)}
.review{list-style:none;margin:0;padding:0;display:grid;gap:8px;width:100%}
.review li{display:grid;grid-template-columns:22px 1fr;gap:10px;font-size:14.5px}
.review .ok{color:var(--mint)} .review .no{color:var(--coral)}

.sort-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:12px;border-radius:16px;border:1px dashed var(--line-strong);margin-bottom:14px;background:var(--white)}
.chip{padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--white);color:var(--text);font-size:14.5px;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint);box-shadow:0 0 0 3px var(--accent-line)}
.chip.right{border-color:var(--mint);background:var(--mint-tint)}
.chip.wrong{border-color:var(--coral);background:var(--coral-tint)}
.chip small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.bucket{display:grid;align-content:start;gap:8px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--secondary);min-height:140px;text-align:left}
.bucket.ready{border-color:var(--accent);border-style:dashed}
.lab-hint{font-size:14.5px;color:var(--muted)}

/* spreadsheet */
.sheet-fig{margin:0;display:grid;gap:8px}
.sheet-fig figcaption{font-size:13.5px;color:var(--muted)}
.sheet-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line);background:var(--white)}
.sheet-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--secondary);font:600 13px var(--f-body);color:var(--text)}
.fx-bar{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line)}
.fx-bar .fx{font-style:italic;color:var(--muted);font-weight:600}
.fx-bar code{background:none;border:0;color:var(--text);font-size:14px}
table.sheet{border-collapse:collapse;font:400 13.5px var(--f-body);min-width:100%}
.sheet th{background:var(--secondary);color:var(--muted);font:500 12px var(--f-body);padding:4px 8px;border:1px solid var(--line);text-align:center}
.sheet td{border:1px solid var(--line);padding:6px 10px;white-space:nowrap;color:var(--text)}
.sheet tr.hdr td{font-weight:600;background:var(--primary)}
.sheet td.num{text-align:right;font-variant-numeric:tabular-nums}
.sheet td.hl{background:var(--mint-tint);outline:2px solid var(--mint);outline-offset:-2px}

/* hotspot image */
.hs-img{position:relative}
.hs-img img{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--line)}
.spot{position:absolute;transform:translate(-50%,-50%);width:32px;height:32px;border-radius:50%;border:2px solid #fff;background:var(--accent);color:var(--on-accent);font:700 13px var(--f-body);display:grid;place-items:center;box-shadow:0 0 0 4px var(--accent-line);animation:pulse 2s infinite}
.spot.seen{background:var(--mint);animation:none;box-shadow:none}
@keyframes pulse{50%{box-shadow:0 0 0 9px rgba(14,116,144,.08)}}
.hs-panel{margin-top:14px;padding:18px 20px;border-radius:16px;background:var(--ink);color:var(--ink-muted);min-height:84px;display:grid;gap:4px}
.hs-panel h3{color:var(--ink-text);font-size:17px}
.hs-panel .eyebrow{color:var(--ink-hi)}

/* job aid card */
.jobaid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.jobaid .l{background:var(--ink);color:var(--ink-muted);padding:24px;display:grid;gap:10px;align-content:start}
.jobaid .l h3{color:var(--ink-text);font-size:22px}
.jobaid .l .eyebrow{color:var(--ink-hi)}
.jobaid .l .btn{background:var(--ink-hi);border-color:var(--ink-hi);color:#000}
.jobaid .r{background:var(--white);padding:20px 24px;display:grid;gap:4px;align-content:start}
.jobaid .row{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.jobaid .row:last-child{border-bottom:0}
.jobaid .plus{color:var(--muted)}

/* reflection */
.refl .q{display:block;margin-bottom:10px;font:700 1.1rem/1.4 var(--f-head);color:var(--text)}
.refl textarea{width:100%;min-height:130px;border:1px solid var(--line-strong);border-radius:12px;padding:14px;background:var(--white);color:var(--text);resize:vertical}
.refl .row{display:flex;justify-content:space-between;gap:12px;margin-top:10px;font-size:14px;color:var(--muted)}

.done-card{padding:clamp(24px,4vw,40px);border-radius:24px;background:var(--ink);color:var(--ink-muted);display:grid;gap:16px}
.done-card h2{color:var(--ink-text);font-size:clamp(1.8rem,3.6vw,2.5rem);font-weight:900}
.done-card .eyebrow{color:var(--ink-hi)}
.done-card strong{color:var(--ink-text)}
.done-card ol{margin:0;padding-left:1.2em;display:grid;gap:6px;color:var(--ink-text)}
.done-card .seal{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:var(--ink-hi);color:#000}
.done-card .seal svg{width:30px;height:30px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--text);color:var(--white);padding:10px 16px;border-radius:12px;font-size:14px;z-index:80}

/* lesson intro with illustration */
.intro{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:center;padding:24px;border-radius:24px;background:var(--white);border:1px solid var(--line)}
.intro.noimg{grid-template-columns:1fr}
.intro-t{display:grid;gap:12px}
.intro-img img{display:block;width:100%;max-height:260px;object-fit:contain}
@media (max-width:760px){.intro{grid-template-columns:1fr}.intro-img img{max-height:200px}}

/* decision scenario */
.dec{border:1px solid var(--line);border-radius:16px;background:var(--white);overflow:hidden}
.dec-head{display:flex;gap:14px;align-items:center;padding:16px 20px;background:var(--ink);color:var(--ink-muted)}
.dec-head b{display:block;color:var(--ink-text);font:700 17px var(--f-head)}
.dec-head .eyebrow{color:var(--ink-hi)}
.dec-head span:not(.eyebrow):not(.av){font-size:14px}
.dec-head img{margin-left:auto;height:72px;width:auto;border-radius:12px;background:var(--white);padding:4px}
.av{flex:none;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--ink-hi);color:#000;font:900 16px var(--f-head)}
.dec-sit{padding:16px 20px 0;color:var(--muted)}
.dec-step{padding:16px 20px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
.dec-step:last-of-type{border-bottom:0}
.dec .q{font:700 1.08rem/1.45 var(--f-head);color:var(--text)}
.dec>.lab-hint{padding:0 20px 16px}
.btn-opt{grid-template-columns:auto 1fr auto;text-align:left;font-size:15px}
.btn-opt:disabled{cursor:default;opacity:1}
.btn-opt:disabled:not(.right):not(.wrong){opacity:.6}

/* voice-over bar */
.vo{margin:0 0 28px}
.vo-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:16px;background:var(--white);position:relative;overflow:hidden}
.vo-row::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;background:var(--accent);opacity:0;transition:opacity .2s}
.vo.on .vo-row::before{opacity:1}
.vo-play{flex:none;width:46px;height:46px;border-radius:50%;border:0;display:grid;place-items:center;color:var(--on-accent);background:var(--accent)}
.vo-play:disabled{opacity:.5;cursor:not-allowed}
.vo-play .i{width:20px;height:20px;fill:currentColor;stroke:currentColor}
.vo-main{flex:1 1 260px;min-width:0;display:grid;gap:4px}
.vo-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.vo-badge{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--f-body);color:var(--accent);background:var(--accent-tint);border:1px solid var(--accent-line);padding:4px 8px;border-radius:9999px}
.vo-badge .i{width:14px;height:14px}
.vo-src{font-size:12.5px;color:var(--muted)}
.vo-cap{font-size:15px;line-height:1.45;color:var(--text);min-height:1.45em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.vo-prog{height:3px;border-radius:9999px;background:var(--line);overflow:hidden}
.vo-prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s ease}
.vo-ctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vo-sel{height:36px;border:1px solid var(--line-strong);border-radius:12px;background:var(--white);color:var(--text);padding:0 8px;font-size:13px;max-width:190px}
.vo-auto{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);min-height:36px}
.vo-auto input{accent-color:var(--accent);width:16px;height:16px}
.vo-tx-btn{height:36px;border:1px solid var(--line-strong);border-radius:12px;background:var(--white);color:var(--text);padding:0 12px;font-size:13px;font-weight:500}
.vo-tx-btn[aria-expanded="true"]{border-color:var(--accent-line);background:var(--accent-tint);color:var(--accent)}
.vo-tx{margin-top:8px;padding:14px 16px;border:1px solid var(--line);border-radius:16px;background:var(--white);font-size:14.5px;max-height:240px;overflow:auto}

/* keyboard help */
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:var(--text);color:var(--white);padding:10px 16px;border-radius:12px;font-weight:600;text-decoration:none}
.skip:focus{top:12px}
.kh-wrap{position:fixed;inset:0;z-index:200;background:rgba(15,23,42,.5);display:grid;place-items:center;padding:16px}
.kh{width:min(560px,100%);max-height:90vh;overflow:auto;background:var(--white);border-radius:16px;padding:20px 22px;box-shadow:0 30px 80px rgba(15,23,42,.3)}
.kh-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.kh h2{font-size:22px}

/* ---------- Responsive ---------- */
@media (max-width:1000px){
  .side{position:fixed;inset:0 auto 0 0;height:100%;transform:translateX(0);margin-left:0!important}
  #app.menu-closed .side{transform:translateX(-102%)}
  #app:not(.menu-closed) .scrim{display:block;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:35}
  .tb-hide{display:none}
}
@media (max-width:760px){
  .cover-body,.ti,.dd,.jobaid,.hero.has-img{grid-template-columns:1fr}
  .cover-body{padding-top:28px;gap:28px}
  .ti.right>figure{order:0}
  .page{padding:28px 16px 48px}
  .page-head{grid-template-columns:1fr}
  .topbar{padding-left:12px;padding-right:12px;gap:4px}
  .crumbs .far{display:none}
  .tb-label{display:none}
  .foot-status .txt{display:none}
  .opt{grid-template-columns:22px auto 1fr auto;padding:12px}
}
/* Course-specific blocks · SS Learning Design Light */

/* ---------- ISBAR ---------- */
:root{--l-i:#0e7490;--l-s:#be123c;--l-b:#047857;--l-a:#0f172a;--l-r:#155e75;--surface-2:#f1f5f9;--teal-soft:#e7f1f4;--ink:#0b0f14}
.L{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:#fff;font:900 20px var(--f-head)}
.bg-i{background:var(--l-i)}.bg-s{background:var(--l-s)}.bg-b{background:var(--l-b)}.bg-a{background:var(--l-a)}.bg-r{background:var(--l-r)}
.isbar-tabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.ltab{display:grid;justify-items:center;gap:6px;padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:var(--white);color:var(--text);font-weight:600;font-size:14px}
.ltab:hover{border-color:var(--line-strong)}
.ltab[aria-selected="true"]{border-color:var(--text);box-shadow:inset 0 -3px 0 var(--text)}
.ltab .seen{font-size:12px;font-weight:500;color:var(--mint);min-height:16px}
.isbar-panel{margin-top:14px;padding:22px;border-radius:16px;background:var(--white);border:1px solid var(--line);display:grid;gap:18px}
.tp-head{display:flex;gap:14px;align-items:flex-start}
.tp-head h3{font-size:21px;margin-bottom:4px}
.tp-body{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.tp-body h4{font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.tp-body ul{margin:0;padding-left:1.15em;display:grid;gap:4px}
.example{grid-column:1/-1;padding:16px 18px;border-radius:12px;background:var(--secondary);border-left:0}
.example p{font:700 1.02rem/1.5 var(--f-head)}
.tbl.obs th[scope="row"]{font-weight:500;color:var(--text);background:var(--white);text-align:left;padding:12px 16px;border-bottom:1px solid var(--line)}
.tbl.obs tfoot td{font-weight:700;background:var(--secondary);border-top:2px solid var(--line-strong)}
.score{display:inline-grid;place-items:center;min-width:30px;height:30px;padding:0 8px;border-radius:9999px;font-weight:700;background:var(--secondary)}
.score.s1{background:var(--accent-tint);color:var(--accent)}.score.s2{background:var(--coral-tint);color:var(--coral)}.score.s3{background:var(--coral);color:#fff}
.patient{display:grid;grid-template-columns:56px 1fr;gap:16px;padding:22px;border-radius:16px;background:var(--white);border:1px solid var(--line)}
.p-av{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.p-av svg{width:28px;height:28px}
.patient h2{font-size:1.3rem;margin:2px 0 8px}
.patient p{max-width:68ch;margin-top:10px}
.idband{display:flex;flex-wrap:wrap;gap:6px}
.idband span{padding:4px 10px;border-radius:9999px;background:var(--secondary);border:1px solid var(--line);font-size:13px;font-weight:600}
.vph{margin:0;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--white)}
.vph-frame{position:relative;aspect-ratio:16/9;display:grid;place-items:center;background:var(--ink)}
.vph-frame .badge{position:absolute;top:14px;left:14px;padding:5px 10px;border-radius:9999px;background:rgba(255,255,255,.12);color:var(--ink-text);font:600 12px var(--f-body);text-transform:uppercase;letter-spacing:.05em}
.vph-frame .play{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;background:var(--ink-hi);color:#000}
.vph-frame .play svg{width:28px;height:28px;fill:currentColor}
.vph-frame .dur{position:absolute;right:14px;bottom:12px;color:var(--ink-text);font-size:13px}
.vph figcaption{padding:16px 18px;display:grid;gap:6px}
.vph figcaption p{color:var(--muted)}
.vid-tx{padding:12px 14px;border-radius:12px;background:var(--secondary);font-size:14.5px}
.aiph{border:1px dashed var(--line-strong);border-radius:16px;background:var(--white);overflow:hidden}
.aiph-head{display:flex;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line)}
.aiph-head .ico{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent)}
.aiph-head h3{font-size:18px;margin:4px 0}
.aiph-head p{color:var(--muted);font-size:14.5px}
.ph-tag{margin-left:8px;padding:2px 8px;border-radius:9999px;background:var(--secondary);border:1px solid var(--line);font-size:12px;font-weight:600}
.aiph-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;padding:18px 20px}
.aiph-grid h4{font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:6px}
.aiph-grid ul{margin:0;padding-left:1.1em;display:grid;gap:4px;font-size:14.5px}
.aiph-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;background:var(--secondary);font-size:14px;color:var(--muted)}
.jobaid-isbar{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--white)}
.ja-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:20px 22px;background:var(--ink);color:var(--ink-muted)}
.ja-head h2{color:var(--ink-text);font-size:22px;margin:4px 0}
.ja-head .eyebrow{color:var(--ink-hi)}
.ja-head .btn.ghost{background:transparent;color:var(--ink-text);border-color:rgba(255,255,255,.4)}
.ja-head .btn.ghost:hover{background:rgba(255,255,255,.08)}
.ja-rows{padding:6px 22px}
.ja-row{display:grid;grid-template-columns:44px minmax(0,1fr) minmax(0,1.2fr);gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.ja-row:last-child{border-bottom:0}
.ja-row h3{font-size:17px}
.ja-row p{color:var(--muted);font-size:14.5px}
.ja-row ul{margin:0;padding-left:1.1em;font-size:14.5px;display:grid;gap:3px}
.ja-foot{padding:14px 22px;background:var(--accent-tint);font-size:14.5px}
@media (max-width:760px){.isbar-tabs{grid-template-columns:repeat(5,minmax(56px,1fr));overflow-x:auto}.ltab span:nth-child(2){font-size:12px}.tp-body,.aiph-grid{grid-template-columns:1fr}.ja-row{grid-template-columns:44px 1fr}.ja-row ul{grid-column:2}}

/* ---------- Dialogue scenario (Asthma on the Ward) ---------- */
.scn-d{border:1px solid var(--line);border-radius:16px;background:var(--white);padding:22px;display:grid;gap:16px}
.scn-d-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.scn-d-top h2{font-size:clamp(1.3rem,2.4vw,1.6rem);margin-top:2px}
.cast{display:flex;flex-wrap:wrap;gap:8px}
.cchip{display:inline-flex;align-items:center;gap:8px;padding:4px 12px 4px 4px;border-radius:9999px;background:var(--secondary);border:1px solid var(--line);font-size:14px;font-weight:500}
.dav{flex:none;width:36px;height:36px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:var(--accent-tint);color:var(--accent);font:900 13px var(--f-head)}
.dav img{width:100%;height:100%;object-fit:cover}
.dav svg{width:18px;height:18px}
.cchip .dav{width:30px;height:30px}
.pl{display:grid;gap:12px}
.dchat{display:grid;gap:10px;padding:16px;border-radius:16px;background:var(--primary);border:1px solid var(--line);min-height:80px}
.dchat:empty::before{content:"Select Play conversation to start. You can also step through line by line.";color:var(--muted);font-size:14.5px}
.scene{display:flex;align-items:center;gap:8px;justify-self:center;padding:6px 14px;border-radius:9999px;font-size:13px;font-weight:600;background:var(--white);border:1px solid var(--line);color:var(--text)}
.scene.dusk{background:#fbf3e8}.scene.night{background:var(--ink);color:var(--ink-text);border-color:var(--ink)}.scene.morning{background:var(--accent-tint)}
.scene svg{width:15px;height:15px}
.dir{font-style:italic;color:var(--muted);text-align:center;max-width:62ch;justify-self:center;font-size:15px}
.d-alert,.d-call,.take{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:15px}
.d-alert{background:var(--coral-tint);border:1px solid var(--coral-line);color:var(--text)}
.d-alert svg{color:var(--coral)}
.d-call{background:var(--accent-tint);border:1px solid var(--accent-line);font-weight:600}
.d-call svg{color:var(--accent)}
.take{justify-self:center;background:var(--ink);color:var(--ink-text);font:700 16px var(--f-head);border-radius:9999px;padding:10px 18px}
.take svg{color:var(--ink-hi)}
.drow{display:flex;gap:10px;align-items:flex-end;max-width:86%}
.drow.me{margin-left:auto;flex-direction:row-reverse}
.bub{padding:10px 14px;border-radius:16px;background:var(--white);border:1px solid var(--line);border-bottom-left-radius:4px;font-size:15px}
.drow.me .bub{background:var(--accent);border-color:var(--accent);color:#fff;border-bottom-left-radius:16px;border-bottom-right-radius:4px}
.bub .who{font:600 12px/16px var(--f-body);text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:2px}
.drow.me .bub .who{color:#fff}
.bub .how{font-style:italic;color:var(--muted);font-size:13.5px}
.drow.me .bub .how{color:#e2f1f5}
.drow.speaking .bub{box-shadow:0 0 0 3px var(--accent-line)}
.ctl{display:flex;flex-wrap:wrap;gap:8px}
.ctl[hidden]{display:none}
.d-q{font-size:1.15rem;margin:6px 0 2px}
.btn-opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint)}
.btn-opt.right{border-color:var(--mint);background:var(--mint-tint)}
.btn-opt.wrong{border-color:var(--line);background:var(--white)}
.btn-opt.wrong .mk{color:var(--coral)}.btn-opt.right .mk{color:var(--mint)}
.deb{padding:20px;border-radius:16px;background:var(--mint-tint);border:1px solid var(--mint-line);display:grid;gap:10px}
.deb .eyebrow{color:var(--mint)}
.deb ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.deb li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15px}
.deb li b{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--white);border:1px solid var(--line-strong);font-family:var(--f-head)}
.deb li.best b{background:var(--mint);border-color:var(--mint);color:#fff}
.deb .ex{padding:12px 14px;border-radius:12px;background:var(--white);font-size:15px}
@media (max-width:640px){.drow{max-width:100%}.scn-d{padding:16px}}

.dav.svgav{background:none}.dav.svgav svg{width:100%;height:100%}
.deb .firstaid{background:#fef3c7;border:1px solid #f2c46d;border-radius:14px;padding:14px 18px;margin:12px 0}.deb .firstaid h4{margin:0 0 6px}.deb .ex h4{margin:16px 0 6px;font-size:1.05rem}
.deb .ex ul{list-style:disc;padding-left:22px;display:block}.deb .ex ol{padding-left:22px;margin:0}.deb .ex li{display:list-item;margin:0 0 6px}.deb .ex p{margin:10px 0 0}.deb .ex>h4:first-child{margin-top:0}.deb .ex .tbl th{width:40%}
</style>
</head>

<script>
/* Asthma on the Ward · branching dialogue scenario (ported from the original course's player).
   Lines play one at a time with a voice per character (device speech), or step through with Next line / Skip.
   Choose A, B or C to hear what happens; the debrief opens once the strongest option has played. */
window.COURSE_BLOCKS = (window.COURSE_BLOCKS || []).concat(function (E) {
  const { h, rc, ic, store, A } = E;
  const CAST = window.CAST || {};
  let voicesOn = store.get('ss:voices', true);
  /* speech */
  let vc = []; const loadV = () => { try { vc = speechSynthesis.getVoices() || []; } catch (e) {} };
  if ('speechSynthesis' in window) { loadV(); try { speechSynthesis.addEventListener('voiceschanged', loadV); } catch (e) {} }
  const VP = { jess: { p: 1.08, r: 1, f: 1 }, margaret: { p: .9, r: .96, f: 1 }, sam: { p: .8, r: 1, f: 0 }, helen: { p: 1.02, r: .92, f: 1 }, amir: { p: .75, r: 1, f: 0 }, mei: { p: 1.08, r: 1, f: 1 }, maggie: { p: .95, r: .95, f: 1 }, harold: { p: .78, r: .85, f: 0 }, other: { p: .85, r: 1, f: 0 } };
  function pick(w) {
    const c = VP[w] || VP.other;
    let pool = vc.filter(v => /^en[-_](AU|GB)/i.test(v.lang)); if (!pool.length) pool = vc.filter(v => /^en/i.test(v.lang));
    const fem = /(female|karen|catherine|natasha|serena|kate|hazel|susan|samantha|libby|sonia|zira)/i, mal = /(male|daniel|james|lee|gordon|ryan|thomas|oliver|george|david|mark)/i;
    const m = pool.filter(v => c.f ? (fem.test(v.name) || !mal.test(v.name)) : mal.test(v.name));
    return m[0] || pool[0] || null;
  }
  function speak(w, text, end) {
    if (!voicesOn || !('speechSynthesis' in window)) return false;
    let fin = false, t; const go = () => { if (fin) return; fin = true; clearTimeout(t); end(); };
    try { E.stopVo(); speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); const v = pick(w); if (v) u.voice = v; u.lang = (v && v.lang) || 'en-AU'; u.pitch = (VP[w] || VP.other).p; u.rate = (VP[w] || VP.other).r; u.onend = go; u.onerror = go; speechSynthesis.speak(u); t = setTimeout(go, text.length * 95 + 3000); }
    catch (e) { return false; }
    return () => { fin = true; clearTimeout(t); };
  }
  const stopSpeak = () => { try { speechSynthesis.cancel(); } catch (e) {} };
  const avatar = k => { const c = CAST[k] || CAST.other; if (c.svg) return h('span', { class: 'dav svgav' + (c.me ? ' me' : ''), html: c.svg }); return h('span', { class: 'dav' + (c.me ? ' me' : '') }, c.img ? h('img', { src: A[c.img], alt: '' }) : c.icon ? ic(c.icon) : c.ini); };

  /* dialogue player */
  function player(steps, onEnd, label) {
    const box = h('div', { class: 'pl' }), chat = h('div', { class: 'dchat', 'aria-live': 'polite' });
    let i = 0, playing = false, tm = null, cancel = null, fired = false, started = false;
    const bPlay = h('button', { class: 'btn sm', type: 'button' }), bNext = h('button', { class: 'btn sm ghost', type: 'button' }, ic('next'), 'Next line'), bSkip = h('button', { class: 'btn sm ghost', type: 'button' }, ic('skip'), 'Skip');
    const bRe = h('button', { class: 'btn sm ghost', type: 'button' }, ic('replay'), 'Replay');
    const ctl = h('div', { class: 'ctl' }, bPlay, bNext, bSkip);
    const setPlay = () => rc(bPlay, ic(playing ? 'pause' : 'play'), playing ? 'Pause' : (started ? 'Resume' : (label || 'Play conversation')));
    const clr = () => { clearTimeout(tm); tm = null; if (cancel) { cancel(); cancel = null; } stopSpeak(); };
    function render(s) {
      let e;
      if (s.t === 'scene') e = h('div', { class: 'scene ' + (s.light || 'day') }, ic('pin'), h('span', null, s.where + ' | ' + s.clock));
      else if (s.t === 'dir') e = h('p', { class: 'dir' }, s.text);
      else if (s.t === 'alert') e = h('div', { class: 'd-alert' }, ic('alert'), h('span', null, s.text));
      else if (s.t === 'call') e = h('div', { class: 'd-call' }, ic('phone'), h('span', null, s.text));
      else if (s.t === 'card') e = h('div', { class: 'take' }, ic('star'), h('span', null, s.text));
      else { const c = CAST[s.who] || CAST.other; e = h('div', { class: 'drow' + (c.me ? ' me' : '') }, avatar(s.who), h('div', { class: 'bub' }, h('div', { class: 'who' }, c.n), s.how ? h('div', { class: 'how' }, '(' + s.how + ')') : null, h('div', null, s.text))); }
      chat.append(e); try { e.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); } catch (x) {} return e;
    }
    function finish() { playing = false; clr(); setPlay(); ctl.hidden = true; if (!box.contains(bRe)) box.append(h('div', { class: 'ctl' }, bRe)); if (!fired) { fired = true; onEnd && onEnd(); } }
    function step() {
      clearTimeout(tm); if (i >= steps.length) { finish(); return; }
      const s = steps[i++]; const e = render(s);
      const wait = () => { if (!playing) return; if (i >= steps.length) { finish(); return; } tm = setTimeout(step, s.t === 'line' ? 500 : 300); };
      if (s.t === 'line') { e.classList.add('speaking'); const un = () => e.classList.remove('speaking'); const c = speak(s.who, s.text, () => { un(); wait(); }); if (c) cancel = () => { c(); un(); }; else tm = setTimeout(() => { un(); wait(); }, 900 + s.text.length * 32); }
      else tm = setTimeout(wait, s.t === 'card' ? 400 : (s.t === 'scene' ? 700 : 1000 + (s.text ? s.text.length * 22 : 0)));
    }
    bPlay.onclick = () => { if (!started) { started = true; playing = true; setPlay(); step(); return; } playing = !playing; setPlay(); if (playing) step(); else clr(); };
