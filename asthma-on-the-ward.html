<title>Asthma on the Ward</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{
--page:#F2FAF8;--raised:#FFFFFF;--card:#DFF2EE;--accent:#0F7A6E;--accent-h:#0C6359;--accent-ink:#0C6359;--on-accent:#FFFFFF;
--sea:#7FE0C4;--sea-ink:#1A7A5E;--sky:#6CB8F2;--sky-ink:#1E6EAD;--text:#123330;--muted:#4C6662;--error:#C0392B;
--accent-10:rgba(15,122,110,.1);--accent-30:rgba(12,99,89,.32);--sea-10:rgba(127,224,196,.22);--sky-10:rgba(108,184,242,.2);
--ov5:rgba(18,51,48,.05);--ov8:rgba(18,51,48,.08);--ov10:rgba(18,51,48,.12);--ov20:rgba(18,51,48,.18);
--glass:rgba(255,255,255,.75);--border:rgba(18,51,48,.08);
--lift:0 16px 30px -10px rgba(18,51,48,.16);--glow:0 10px 15px -3px rgba(15,122,110,.32),0 4px 6px -4px rgba(15,122,110,.28);
--font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--page:#0E1D1C;--raised:#142A28;--card:#1B3633;--accent:#2BB5A3;--accent-h:#5FD3C2;--accent-ink:#5FD3C2;--on-accent:#0E1D1C;
--sea-ink:#7FE0C4;--sky-ink:#8CC8F5;--text:#EFFAF7;--muted:#9DB5B0;--error:#FF8A7A;
--accent-10:rgba(43,181,163,.14);--accent-30:rgba(95,211,194,.38);--sea-10:rgba(127,224,196,.12);--sky-10:rgba(108,184,242,.14);
--ov5:rgba(255,255,255,.05);--ov8:rgba(255,255,255,.08);--ov10:rgba(255,255,255,.12);--ov20:rgba(255,255,255,.18);
--glass:rgba(20,42,40,.72);--border:rgba(255,255,255,.1);--lift:0 16px 30px -10px rgba(0,0,0,.5);--glow:0 10px 15px -3px rgba(43,181,163,.3),0 4px 6px -4px rgba(43,181,163,.25)}}
:root[data-theme="dark"]{
--page:#0E1D1C;--raised:#142A28;--card:#1B3633;--accent:#2BB5A3;--accent-h:#5FD3C2;--accent-ink:#5FD3C2;--on-accent:#0E1D1C;
--sea-ink:#7FE0C4;--sky-ink:#8CC8F5;--text:#EFFAF7;--muted:#9DB5B0;--error:#FF8A7A;
--accent-10:rgba(43,181,163,.14);--accent-30:rgba(95,211,194,.38);--sea-10:rgba(127,224,196,.12);--sky-10:rgba(108,184,242,.14);
--ov5:rgba(255,255,255,.05);--ov8:rgba(255,255,255,.08);--ov10:rgba(255,255,255,.12);--ov20:rgba(255,255,255,.18);
--glass:rgba(20,42,40,.72);--border:rgba(255,255,255,.1);--lift:0 16px 30px -10px rgba(0,0,0,.5);--glow:0 10px 15px -3px rgba(43,181,163,.3),0 4px 6px -4px rgba(43,181,163,.25)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--page);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased}
::selection{background:var(--sea);color:#123330}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3,p{margin:0}
.svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:1152px;margin:0 auto;padding:0 24px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink)}
.grad{background:linear-gradient(to right,#0F7A6E,#1A8F6E,#1E6EAD);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-theme="dark"] .grad{background:linear-gradient(to right,#5FD3C2,#7FE0C4,#8CC8F5);-webkit-background-clip:text;background-clip:text}
/* top bar */
.bar{position:sticky;top:0;z-index:30;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.bar .wrap{display:flex;align-items:center;gap:12px;height:60px}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;font-weight:700;font-size:15px;min-width:0}
.mono{width:34px;height:34px;border-radius:10px;background:linear-gradient(to top right,#0F7A6E,#6CB8F2);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.brand span.t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.ib{height:38px;min-width:38px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--raised);display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:13px;font-weight:600;transition:all 150ms}
.ib:hover{border-color:var(--accent-30);color:var(--accent-ink)}
.ib[aria-pressed="false"]{color:var(--muted)}
.prog{height:3px;background:var(--ov8)}
.prog i{display:block;height:100%;width:0;background:linear-gradient(to right,#0F7A6E,#6CB8F2);transition:width 250ms}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:8px;height:46px;padding:0 24px;border-radius:999px;border:0;background:var(--accent);color:var(--on-accent);font-weight:600;font-size:14px;transition:all 250ms}
.btn:hover{background:var(--accent-h);box-shadow:var(--glow)}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--accent-30)}
.btn.ghost:hover{background:var(--accent-10);box-shadow:none}
.btn.sm{height:38px;padding:0 16px;font-size:13px}
/* hero */
.hero{position:relative;overflow:hidden;padding:56px 0 40px}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(10px);pointer-events:none}
.hero:before{width:560px;height:560px;left:-160px;top:-220px;background:radial-gradient(circle,rgba(127,224,196,.5),transparent 68%)}
.hero:after{width:520px;height:520px;right:-140px;top:-200px;background:radial-gradient(circle,rgba(108,184,242,.45),transparent 68%)}
.hero .wrap{position:relative;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(38px,6vw,60px);line-height:1.04;font-weight:800;letter-spacing:-.03em;margin:14px 0 16px}
.hero p.lead{font-size:17px;color:var(--muted);max-width:520px;margin-bottom:24px}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:13px;color:var(--muted);font-weight:500}
.meta span{display:inline-flex;align-items:center;gap:6px}
.art{display:flex;align-items:flex-end;justify-content:center;gap:0;background:var(--glass);border:1px solid var(--border);border-radius:24px;padding:24px 16px 0;backdrop-filter:blur(12px);min-height:340px;overflow:hidden}
.art img{display:block;height:300px;width:auto;object-fit:contain}
.art img.s{height:220px;margin-left:-28px;-webkit-mask-image:linear-gradient(to right,transparent,#000 22%);mask-image:linear-gradient(to right,transparent,#000 22%)}
.sect{padding:36px 0}
.sect h2{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 0 20px}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.lcard{text-align:left;background:var(--raised);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px;transition:transform 250ms,border-color 250ms,box-shadow 250ms}
.lcard:hover{transform:translateY(-4px);border-color:var(--accent-30);box-shadow:var(--lift)}
.lcard h3{font-size:18px;font-weight:600;line-height:1.3}
.lcard p{font-size:14px;color:var(--muted)}
.lcard .st{margin-top:auto;font-size:12px;font-weight:600;color:var(--muted);display:flex;gap:6px;align-items:center}
.lcard.done .st{color:var(--sea-ink)}
.disc{font-size:13px;color:var(--muted);border-top:1px solid var(--border);padding:24px 0 48px}
/* blob tiles */
.blob{position:relative;width:48px;height:48px;flex:none;display:grid;place-items:center}
.blob svg.b{position:absolute;inset:0;width:100%;height:100%}
.blob .svg{position:relative;width:22px;height:22px}
.blob.accent{color:var(--accent-ink)}.blob.accent path{fill:var(--accent-10)}
.blob.sea{color:var(--sea-ink)}.blob.sea path{fill:var(--sea-10)}
.blob.sky{color:var(--sky-ink)}.blob.sky path{fill:var(--sky-10)}
.blob.sm{width:36px;height:36px}.blob.sm .svg{width:18px;height:18px}
/* lesson */
.lesson{max-width:800px;margin:0 auto;padding:36px 24px 120px}
.sec{margin-bottom:8px;animation:in 250ms ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.lh h1{font-size:clamp(30px,5vw,44px);line-height:1.1;font-weight:800;letter-spacing:-.025em;margin:10px 0 14px}
.outcome{display:flex;gap:14px;background:var(--accent-10);border-radius:16px;padding:16px 18px;margin:20px 0;align-items:flex-start}
.outcome p{font-size:14px}
.statement{font-size:20px;line-height:1.5;font-weight:500;padding:8px 0}
.gate{display:flex;align-items:center;gap:16px;margin:28px 0}
.gate:before,.gate:after{content:"";flex:1;height:1px;background:var(--ov10)}
.gate.done{opacity:.6}
.gate.done .btn{display:none}
.gate.done:after{content:none}
.gate.done:before{background:var(--ov10)}
.blk{background:var(--raised);border:1px solid var(--border);border-radius:16px;padding:22px;margin:18px 0}
.blk h3{font-size:18px;font-weight:600;margin-bottom:4px}
.blk .sub{font-size:14px;color:var(--muted);margin-bottom:16px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fc{text-align:left;min-height:150px;background:var(--card);border:1px solid transparent;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:all 250ms}
.fc:hover{border-color:var(--accent-30);transform:translateY(-4px)}
.fc b{font-size:16px;font-weight:600}
.fc small{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);margin-top:auto}
.fc p{font-size:14px}
.fc.flip{background:var(--accent-10);border-color:var(--accent-30)}
.acc{border-top:1px solid var(--border)}
.acc:first-of-type{border-top:0}
.acc>button{width:100%;display:flex;align-items:center;gap:12px;justify-content:space-between;background:none;border:0;padding:14px 0;text-align:left;font-weight:600;font-size:16px}
.acc>button .svg{transition:transform 250ms;color:var(--accent-ink)}
.acc.open>button .svg{transform:rotate(180deg)}
.acc .pn{display:none;padding:0 0 16px;color:var(--muted);font-size:14.5px}
.acc.open .pn{display:block}
.tabs{display:flex;gap:6px;background:var(--ov5);padding:4px;border-radius:999px;margin-bottom:16px;overflow-x:auto}
.tabs button{border:0;background:none;padding:8px 16px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap;color:var(--muted);transition:all 150ms}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--on-accent)}
.tp{font-size:15px;min-height:60px}
.tp b{display:block;font-size:16px;margin-bottom:6px}
.tp .q{border-left:3px solid var(--sea);padding:2px 0 2px 14px;margin-top:10px;color:var(--muted)}
.proc{display:grid;grid-template-columns:auto 1fr;gap:20px}
.rail{display:flex;flex-direction:column;gap:8px}
.rail button{width:38px;height:38px;border-radius:50%;border:1px solid var(--ov20);background:var(--raised);font-weight:700;font-size:14px;transition:all 150ms}
.rail button[aria-current="step"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.rail button.seen{background:var(--accent-10);border-color:var(--accent-30);color:var(--accent-ink)}
.pbody small{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink)}
.pbody h4{margin:4px 0 6px;font-size:18px;font-weight:600}
.pbody p{color:var(--muted);font-size:14.5px}
.pnav{display:flex;gap:8px;margin-top:14px}
/* scenario */
.scn{background:var(--raised);border:1px solid var(--border);border-radius:24px;padding:20px;margin:18px 0}
.scn>h3{font-size:18px;font-weight:600}
.cast{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0 16px}
.chip{display:inline-flex;align-items:center;gap:8px;background:var(--ov5);border-radius:999px;padding:4px 12px 4px 4px;font-size:13px;font-weight:500}
.av{width:36px;height:36px;border-radius:50%;overflow:hidden;background:var(--card);flex:none;display:grid;place-items:center;color:var(--accent-ink);font-weight:700;font-size:12px}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.chat{display:flex;flex-direction:column;gap:12px;padding:4px 0 8px}
.scene{align-self:center;display:inline-flex;gap:8px;align-items:center;font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent-10);border-radius:999px;padding:6px 14px;animation:in 250ms both;text-align:center}
.scene.night{background:rgba(18,51,48,.9);color:#BFEFE6}
.scene.dusk{background:var(--sky-10);color:var(--sky-ink)}
.dir{align-self:center;max-width:620px;text-align:center;font-style:italic;color:var(--muted);font-size:14px;animation:in 250ms both}
.row{display:flex;gap:10px;align-items:flex-end;animation:in 250ms both;max-width:88%}
.row.me{align-self:flex-end;flex-direction:row-reverse}
.bub{background:var(--card);border-radius:16px 16px 16px 4px;padding:10px 14px;font-size:15px}
.row.me .bub{background:var(--accent);color:var(--on-accent);border-radius:16px 16px 4px 16px}
.who{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:2px}
.row.me .who{color:inherit;opacity:.85;text-align:right}
.how{font-size:12px;font-style:italic;opacity:.8;margin-bottom:2px}
.row.speaking .bub{box-shadow:0 0 0 2px var(--sea)}
.alert{align-self:center;display:flex;gap:12px;align-items:flex-start;border:1px solid var(--accent-30);background:var(--sky-10);border-radius:16px;padding:12px 16px;font-size:14px;font-weight:500;max-width:620px;animation:in 250ms both}
.alert .svg{color:var(--sky-ink);margin-top:2px}
.call{align-self:center;display:inline-flex;gap:8px;align-items:center;border:1px dashed var(--accent-30);border-radius:999px;padding:6px 16px;font-size:13px;font-weight:600;color:var(--accent-ink);animation:in 250ms both}
.take{align-self:stretch;background:linear-gradient(to top right,var(--accent-10),var(--sky-10));border:1px solid var(--accent-30);border-radius:16px;padding:14px 18px;font-weight:600;font-size:16px;display:flex;gap:12px;align-items:center;animation:in 250ms both}
.take .svg{color:var(--accent-ink)}
.ctl{position:sticky;bottom:12px;z-index:5;display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:center;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:999px;padding:8px;margin-top:12px;width:fit-content;margin-left:auto;margin-right:auto;max-width:100%}
.opts{display:grid;gap:10px;margin:12px 0}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;background:var(--raised);border:1px solid var(--ov10);border-radius:16px;padding:14px 16px;transition:all 250ms;font-size:14.5px}
.opt:hover:not(:disabled){border-color:var(--accent-30);transform:translateY(-2px)}
.opt .l{width:30px;height:30px;border-radius:50%;background:var(--accent-10);color:var(--accent-ink);font-weight:700;display:grid;place-items:center;flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-10)}
.opt.ok{border-color:var(--sea-ink);background:var(--sea-10)}
.opt.no{border-color:var(--error)}
.opt:disabled{cursor:default}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.deb{background:var(--sea-10);border:1px solid var(--accent-30);border-radius:16px;padding:20px;margin-top:16px;animation:in 250ms both}
.deb h3{font-size:18px;font-weight:600;margin-bottom:6px}
.deb ul{margin:12px 0;padding:0;list-style:none;display:grid;gap:8px;font-size:14.5px}
.deb li{display:flex;gap:10px}
.deb li b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--raised);display:grid;place-items:center;font-size:12px}
.deb li.best b{background:var(--accent);color:var(--on-accent)}
.deb .ex{font-size:14.5px;color:var(--muted);border-top:1px solid var(--accent-30);padding-top:12px;margin-top:12px}
.fb{margin-top:10px;font-size:14.5px;padding:12px 16px;border-radius:12px;background:var(--ov5);animation:in 250ms both}
.fb.ok{background:var(--sea-10)}
.chk{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
.chk label{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--ov5);font-size:14.5px;cursor:pointer;transition:background 150ms}
.chk label:hover{background:var(--accent-10)}
.chk input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.fin{text-align:center;padding:32px 20px}
.fin h2{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:14px 0 8px}
.fin p{color:var(--muted);margin-bottom:18px}
.fin .blob{margin:0 auto}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* drawer */
.dr-bg{position:fixed;inset:0;background:rgba(18,51,48,.4);z-index:40;display:none}
.dr-bg.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);background:var(--raised);z-index:41;transform:translateX(100%);transition:transform 250ms;padding:20px;overflow:auto;border-left:1px solid var(--border)}
.drawer.on{transform:none}
.drawer h2{font-size:20px;font-weight:700;margin-bottom:4px}
.dli{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:1px solid var(--border);border-radius:16px;padding:12px;margin-top:10px;transition:all 250ms}
.dli:hover{border-color:var(--accent-30)}
.dli.cur{background:var(--accent-10);border-color:var(--accent-30)}
.dli small{display:block;color:var(--muted);font-size:12px}
.dli b{font-size:14.5px;font-weight:600}
.sr{position:absolute;left:-9999px}
@media (max-width:860px){.hero .wrap{grid-template-columns:1fr}.lgrid{grid-template-columns:1fr 1fr}.art img{height:240px}.art img.s{height:180px}}
