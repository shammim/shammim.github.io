<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Shammim's Portfolio | Instructional Design & Learning Experience</title>

  <!-- Tab Favicon (Keep S_logo.png file near the title) -->
  <link rel="icon" type="image/png" href="S_logo.png" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Custom Tailwind Theme Configuration -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
          colors: {
            primary: "#0B0F14", secondary: "#151B23", cardBg: "#1C2430",
            accent: "#22D3EE", accentHover: "#06B6D4", coral: "#FB7185",
            mint: "#34D399", text: "#F8FAFC", muted: "#94A3B8"
          }
        }
      }
    }
  </script>

  <!-- Custom Utilities -->
  <style>
    .glass { background: rgba(21, 27, 35, 0.7); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .lift { transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease; }
    .lift:hover { transform: translateY(-4px); box-shadow: 0 16px 30px -10px rgba(0, 0, 0, 0.6); border-color: rgba(34, 211, 238, 0.3); }
    /* Fix for smooth scrolling with fixed header */
    :target { scroll-margin-top: 80px; }
  </style>
</head>

<body class="bg-primary text-text font-sans antialiased overflow-x-hidden selection:bg-accent selection:text-black">

  <!-- ========================= 
       NAVIGATION 
  ========================= -->
  <header class="fixed top-0 left-0 w-full z-40 bg-primary/80 backdrop-blur-md border-b border-white/10">
    <nav class="max-w-6xl mx-auto flex justify-between items-center px-6 py-4">

      <!-- Logo Section - Magnolia: Keep S_logo.png file near the title -->
      <a href="#home" class="flex items-center gap-3 group">
        <img 
          src="S_logo.png" 
          alt="Shammim Logo Monogram" 
          class="w-12 h-12 object-contain rounded-xl shadow-md shadow-accent/20 group-hover:scale-110 transition-transform duration-300"
        />
        <div class="flex flex-col">
          <span class="text-xl font-bold tracking-tight text-text group-hover:text-accent transition-colors leading-tight">
            Shammim's Portfolio<span class="text-accent">.</span>
          </span>
          <span class="text-[10px] tracking-wider uppercase font-medium text-muted">
            Instructional Design
          </span>
        </div>
      </a>

      <!-- Desktop Navigation Links -->
      <ul class="hidden md:flex items-center gap-7 text-sm font-medium text-muted">
        <li><a href="#home" class="hover:text-accent transition-colors">Home</a></li>
        <li><a href="#about" class="hover:text-accent transition-colors">About</a></li>
        <li><a href="#services" class="hover:text-accent transition-colors">Services</a></li>
        <li><a href="#casestudies" class="hover:text-accent transition-colors">Case Studies</a></li>
        <li><a href="#contact" class="bg-accent/10 border border-accent/30 text-accent px-4 py-2 rounded-full hover:bg-accent hover:text-black transition-all">Let's Talk</a></li>
      </ul>

      <!-- Mobile Hamburger Button -->
      <button id="mobileMenuBtn" aria-label="Toggle menu" class="md:hidden text-muted hover:text-text focus:outline-none">
        <i data-lucide="menu" class="w-6 h-6"></i>
      </button>
    </nav>
  </header>

  <!-- ... (The rest of your original HTML content, Hero, About, Services, Case Studies, Contact, Footer remain exactly the same) ... -->

  <!-- ========================= 
       FOOTER 
  ========================= -->
  <footer class="py-12 border-t border-white/10 text-center text-muted text-sm bg-primary mt-20">
    <div class="max-w-6xl mx-auto px-6 flex flex-col sm:flex-row justify-between items-center gap-4">
      <p>© 2024 Shammim's Portfolio. All rights reserved.</p>
    </div>
  </footer>

  <!-- ========================= 
       JAVASCRIPT FOR THE PORTFOLIO (Buttons Functional)
  ========================= -->
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Mobile Menu Toggle
    const mobileMenuBtn = document.getElementById('mobileMenuBtn');
    const mobileMenu = document.getElementById('mobileMenu');
    if (mobileMenuBtn && mobileMenu) {
        mobileMenuBtn.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    }

    // Contact Form Handler (Simulator)
    function handleFormSubmit(event) {
      event.preventDefault();
      const form = event.target;
      const submitBtn = form.querySelector('button[type="submit"]');
      
      // Receives message in email: sshammim@gmail.com simulator
      submitBtn.disabled = true;
      submitBtn.innerText = "Sending to sshammim@gmail.com...";

      setTimeout(() => {
        alert("Thank you! Your message has been simulated sent to sshammim@gmail.com.");
        form.reset();
        submitBtn.disabled = false;
        submitBtn.innerText = "Send Message";
      }, 1500);
    }
  </script>

  <!-- ========================= 
       CHATBOT FEATURE (Botpress)
       This script activates the chat widget on the bottom right.
       Note: You must follow the setup steps below to make it function.
  ========================= -->
  <script src="https://cdn.botpress.cloud/webchat/v1/inject.js"></script>
  <script src="https://mediafiles.botpress.cloud/00000000-0000-0000-0000-000000000000/webchat/config.js" defer></script>

</body>
</html>
